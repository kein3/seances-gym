<script>
const PAYLOAD = JSON.parse(document.getElementById('payload').textContent);
const { order, meta, sessions } = PAYLOAD;

// ═══ RENDER HOME ═══
function renderHome() {
  const container = document.getElementById('home-sessions');
  container.innerHTML = order.map(key => {
    const s = sessions[key];
    const m = meta[key];
    // Count exercises for meta
    let exCount = 0;
    s.blocs.forEach(b => {
      exCount += (b.exercises || []).length;
      (b.supersets || []).forEach(ss => exCount += ss.exercises.length);
      if (b.rounds) exCount += b.rounds.length;
      if (b.amrap) exCount += (b.amrap.movements || []).length;
    });
    const blocCount = s.blocs.length;
    let lastDoneHtml = '';
    try {
      const ld = localStorage.getItem('lastDone:' + key);
      if (ld) lastDoneHtml = `<span class="last-done">· ${escape(formatDate(ld))}</span>`;
    } catch(e) {}
    return `
      <div class="session-card" data-session="${key}" style="--accent-color:${m.accent}">
        <div class="session-card-avatar">${escape((m.short || s.title).charAt(0).toUpperCase())}</div>
        <div class="session-card-body">
          <div class="session-card-name">${escape(s.title)}</div>
          <div class="session-card-meta">
            <span>⏱ 60 min</span>
            <span>· ${blocCount} blocs</span>
            <span>· ${exCount} exercices</span>
            ${lastDoneHtml}
          </div>
        </div>
        <span class="session-card-arrow">›</span>
      </div>
    `;
  }).join('') + `
      <div class="session-card" id="tabata-open" style="--accent-color:#ff9f0a">
        <div class="session-card-avatar">⏱</div>
        <div class="session-card-body">
          <div class="session-card-name">Tabata</div>
          <div class="session-card-meta">
            <span id="tabata-card-meta">${tabataCfg.work}s effort · ${tabataCfg.rest}s repos · ${tabataCfg.rounds} rounds</span>
          </div>
        </div>
        <span class="session-card-arrow">›</span>
      </div>
    `;

  container.querySelectorAll('.session-card[data-session]').forEach(c => {
    c.addEventListener('click', () => openSession(c.dataset.session));
  });
  document.getElementById('tabata-open').addEventListener('click', openTabataConfig);
}

// ═══ RENDER SESSION ═══
let currentSessionKey = null;

function openSession(key, updateHistory = true) {
  currentSessionKey = key;
  const s = sessions[key];
  const m = meta[key];
  if (!s || !m) return;
  if (updateHistory) {
    try { history.pushState({ view: 'session', key }, '', `#${key}`); } catch(e) {}
  }
  document.body.classList.remove('view-home');
  document.body.classList.add('view-session');
  document.body.style.setProperty('--accent-color', m.accent);
  document.getElementById('topbar-accent').style.background = m.accent;
  document.getElementById('topbar-title').textContent = s.title;
  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-session').classList.add('active');

  const pills = (s.pills || []).map((p, i) => 
    `<span class="session-pill${i === 0 ? ' primary' : ''}">${escape(p)}</span>`
  ).join('');

  // Bloc nav buttons
  const blocNav = s.blocs.map((b, idx) => {
    const num = String(idx + 1).padStart(2, '0');
    const name = b.name || '';
    return `<button class="bloc-nav-btn" data-bloc="${idx}"><span class="num">${num}</span>${name ? escape(name) : ''}</button>`;
  }).join('');

  const blocs = s.blocs.map((b, idx) => renderBloc(b, idx + 1, m.accent, key)).join('');

  document.getElementById('session-content').innerHTML = `
    <div class="session-hero" style="--accent-color:${m.accent}">
      <h1>${escape(s.title)}</h1>
      <div class="session-pills">${pills}</div>
      <div class="session-progress hidden" id="session-progress">
        <div class="session-progress-track"><div class="session-progress-fill" id="sp-fill"></div></div>
        <div class="session-progress-text"><span id="sp-text"></span><span id="sp-time"></span></div>
      </div>
    </div>
    <nav class="bloc-nav" id="bloc-nav">${blocNav}</nav>
    <div id="bloc-list">${blocs}</div>
  `;

  // Bind exercise toggles
  document.querySelectorAll('.ex-head').forEach(h => {
    h.addEventListener('click', (e) => {
      // don't toggle if clicking inside textarea or clear button
      if (e.target.tagName === 'TEXTAREA' || e.target.classList.contains('ex-note-clear')) return;
      h.closest('.ex').classList.toggle('open');
    });
  });

  // Bind bloc nav
  document.querySelectorAll('.bloc-nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.bloc);
      const target = document.getElementById(`bloc-${idx}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  // Bind notes
  bindNotes();
  restoreNotes();
  bindCharges();
  restoreCharges();
  bindRestTimers();
  bindSets();
  startProgressTicker();
  acquireWakeLock();
  trackBlocScroll();

  // Scroll to top
  window.scrollTo(0, 0);
}

// Track which bloc is currently visible
let _blocScrollHandler = null;

function trackBlocScroll() {
  const blocs = document.querySelectorAll('.bloc');
  const navBtns = document.querySelectorAll('.bloc-nav-btn');
  const navEl = document.getElementById('bloc-nav');
  let ticking = false;
  let lastActiveIdx = -1;

  const update = () => {
    ticking = false;
    if (!navEl) return;
    const navBottom = navEl.getBoundingClientRect().bottom;
    let activeIdx = 0;
    blocs.forEach((b, i) => {
      const rect = b.getBoundingClientRect();
      if (rect.top <= navBottom + 40) activeIdx = i;
    });

    if (activeIdx !== lastActiveIdx) {
      navBtns.forEach((btn, i) => {
        btn.classList.toggle('active', i === activeIdx);
      });
      lastActiveIdx = activeIdx;

      const activeBtn = navBtns[activeIdx];
      if (activeBtn && navEl) {
        const btnRect = activeBtn.getBoundingClientRect();
        const navRect = navEl.getBoundingClientRect();
        if (btnRect.left < navRect.left + 10 || btnRect.right > navRect.right - 10) {
          const targetLeft = activeBtn.offsetLeft - navEl.clientWidth / 2 + activeBtn.offsetWidth / 2;
          navEl.scrollTo({ left: targetLeft, behavior: 'smooth' });
        }
      }
    }
  };

  const onScroll = () => {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  };

  // Properly remove previous listener
  if (_blocScrollHandler) {
    window.removeEventListener('scroll', _blocScrollHandler);
  }
  _blocScrollHandler = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  lastActiveIdx = -1;
  update();
}

function renderBloc(b, num, accent, sessionKey) {
  const blocIdx = num - 1;
  const chip = b.chip || `Bloc 0${num}`;
  const name = b.name || '';
  const sub = b.sub || '';
  const dur = b.duration || '';

  let body = '';

  // Regular exercises
  (b.exercises || []).forEach((ex, i) => {
    body += renderEx(ex, i + 1, false, sessionKey, blocIdx, i);
  });

  // Supersets
  (b.supersets || []).forEach((ss, idx) => {
    const rounds = getSupersetRounds(ss);
    const sequence = getSupersetSequence(ss);
    const exHtml = ss.exercises.map((ex, i) => 
      renderEx(ex, String.fromCharCode(65 + i), true, sessionKey, blocIdx, `ss${idx}-${i}`)
    ).join('');
    const rest = ss.rest ? renderSupersetRest(ss.rest, idx + 1) : '';
    const toursTotal = parseInt(rounds) || 0;
    const ssRestSec = parseRestSeconds(ss.rest || '');
    const toursTracker = toursTotal > 0 ? `
      <div class="ex-sets superset-sets" data-sets-key="sets:${sessionKey}:${blocIdx}:ss${idx}" data-sets-total="${toursTotal}" data-rest-seconds="${ssRestSec}" data-rest-label="Superset ${idx + 1}">
        <span class="ex-sets-label">Tours</span>
        <div class="ex-sets-dots"></div>
        <button type="button" class="ex-sets-reset" aria-label="Réinitialiser les tours">↺</button>
      </div>` : '';
    body += `
      <div class="superset">
        <div class="superset-banner">⚡ Superset ${String(idx + 1).padStart(2, '0')}</div>
        <div class="superset-meta">
          <div class="superset-rounds">${escape(rounds)} tours</div>
          <div class="superset-sequence">${escape(sequence)}</div>
        </div>
        ${exHtml}
        ${toursTracker}
        ${rest}
      </div>
    `;
  });

  // Hyrox rounds
  if (b.rounds && b.rounds.length) {
    if (b.sim_title) {
      body += `<div class="hyrox-note">${escape(b.sim_title)}</div>`;
    }
    b.rounds.forEach(r => {
      body += `
        <div class="hyrox-round">
          <div class="round-num">${escape(r.num)}</div>
          <div class="round-body">
            ${r.run_val ? `
              <div class="round-part">
                <span class="round-part-icon">${r.run_icon || '🏃'}</span>
                <div class="round-part-info">
                  <div class="round-part-label">${escape(r.run_label || 'Course')}</div>
                  <div class="round-part-val">${escape(r.run_val)}</div>
                </div>
              </div>
            ` : ''}
            ${r.st_label ? `
              <div class="round-part">
                <span class="round-part-icon">${r.st_icon || '💪'}</span>
                <div class="round-part-info">
                  <div class="round-part-label">${escape(r.st_label)}</div>
                  <div class="round-part-val">${escape(r.st_val)}</div>
                  ${r.st_sub ? `<div class="round-part-sub">${escape(r.st_sub)}</div>` : ''}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    });
    if (b.sim_footer) {
      body += `<div class="hyrox-note">${escape(b.sim_footer)}</div>`;
    }
  }

  // AMRAP
  if (b.amrap) {
    if (b.amrap.header) {
      body += `<div class="hyrox-note">${escape(b.amrap.header)}</div>`;
    }
    (b.amrap.movements || []).forEach(mv => {
      body += `
        <div class="amrap-item">
          <div class="amrap-icon">${mv.icon || '•'}</div>
          <div>
            <div class="amrap-label">${escape(mv.label)}</div>
            <div class="amrap-val">${escape(mv.val)}</div>
            ${mv.sub ? `<div class="amrap-sub">${escape(mv.sub)}</div>` : ''}
          </div>
        </div>
      `;
    });
    if (b.amrap.footer) {
      body += `<div class="amrap-note">${escape(b.amrap.footer)}</div>`;
    }
  }

  return `
    <section class="bloc" id="bloc-${blocIdx}">
      <div class="bloc-header">
        <div class="bloc-num">0${num}</div>
        <div class="bloc-title-group">
          <div class="bloc-name">${escape(name)}</div>
          ${sub ? `<div class="bloc-sub">${escape(sub)}</div>` : ''}
          ${dur ? `<div class="bloc-duration">${escape(dur)}</div>` : ''}
        </div>
      </div>
      ${body}
    </section>
  `;
}


function getSupersetRounds(ss) {
  if (!ss) return '3';
  const explicit = ss.rounds || ss.tours || ss.sets || ss.series || ss.séries;
  if (explicit) return String(explicit).replace(/\s*tours?$/i, '').trim();
  const exercises = ss.exercises || [];
  for (const ex of exercises) {
    const stats = ex.stats || {};
    const val = stats['Séries'] || stats['Series'] || stats['Tours'];
    if (val) return String(val).replace(/\s*tours?$/i, '').trim();
  }
  return '3';
}

function getSupersetSequence(ss) {
  const count = Math.max(0, (ss && ss.exercises ? ss.exercises.length : 0));
  if (!count) return 'Enchaînement';
  const letters = Array.from({ length: count }, (_, i) => String.fromCharCode(65 + i)).join(' + ');
  return `Enchaîne ${letters}`;
}

function renderSupersetRest(restText, supersetNum) {
  const seconds = parseRestSeconds(restText);
  if (!seconds) {
    return `<div class="superset-footer">${escape(restText)}</div>`;
  }
  return `
    <button type="button" class="superset-rest-card timer-ready" data-rest-seconds="${seconds}" data-rest-label="Superset ${supersetNum}">
      <span class="superset-rest-label">Repos superset</span>
      <span class="superset-rest-start">Lancer</span>
      <span class="superset-rest-value">${escape(restText)}</span>
    </button>
  `;
}

// Parse rest duration (seconds) from "2 min", "90 sec", "2'30", "3 min" etc.
function parseRestSeconds(restStr) {
  if (!restStr) return 0;
  const s = String(restStr).toLowerCase();
  // Try "X'YY" (e.g. 2'30)
  let m = s.match(/(\d+)\s*['′]\s*(\d+)/);
  if (m) return parseInt(m[1]) * 60 + parseInt(m[2]);
  // "X min YY sec"
  m = s.match(/(\d+)\s*min\s*(\d+)\s*sec/);
  if (m) return parseInt(m[1]) * 60 + parseInt(m[2]);
  // Range first: "45-60 sec" or "60–75 sec" → take lower bound
  m = s.match(/(\d+)\s*[\-–]\s*\d+\s*sec/);
  if (m) return parseInt(m[1]);
  m = s.match(/(\d+)\s*[\-–]\s*\d+\s*min/);
  if (m) return parseInt(m[1]) * 60;
  // "X min"
  m = s.match(/(\d+(?:[.,]\d+)?)\s*min/);
  if (m) {
    const v = parseFloat(m[1].replace(',', '.'));
    return Math.round(v * 60);
  }
  // "XX sec"
  m = s.match(/(\d+)\s*sec/);
  if (m) return parseInt(m[1]);
  // First number fallback, assume minutes if < 20
  m = s.match(/(\d+)/);
  if (m) {
    const n = parseInt(m[1]);
    return n < 20 ? n * 60 : n;
  }
  return 0;
}

function renderEx(ex, num, inSuperset, sessionKey, blocIdx, exIdx) {
  const stats = ex.stats || {};
  const statsOrder = ['Séries', 'Reps', 'Charge', 'Tempo', 'Amplitude', 'Durée', 'Taps', 'Pause', 'Repos'];
  const sortedKeys = Object.keys(stats).sort((a, b) => {
    const ai = statsOrder.indexOf(a);
    const bi = statsOrder.indexOf(b);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  const statsHtml = sortedKeys.map(k => {
    const isRest = k === 'Repos';
    const val = String(stats[k]).replace(/Poids de corps/i, 'Poids corps');
    const restAttr = isRest ? ` data-rest-seconds="${parseRestSeconds(val)}" data-rest-label="${escape(ex.name)}"` : '';
    return `
      <div class="stat${isRest ? ' rest' : ''}"${restAttr}>
        <div class="stat-label">${escape(k)}</div>
        <div class="stat-value">${escape(val)}</div>
        ${isRest ? '<div class="rest-start-chip">Lancer</div>' : ''}
      </div>
    `;
  }).join('');

  let details = '';
  if (ex.execution) {
    details += `<div class="detail-block"><div class="detail-label">Exécution</div><div class="detail-text">${escape(ex.execution)}</div></div>`;
  }
  if (ex.avoid) {
    details += `<div class="detail-warn">${escape(ex.avoid)}</div>`;
  }
  if (ex.alt) {
    details += `<div class="detail-alt"><div><strong>${escape(ex.alt.label)}</strong>${escape(ex.alt.text)}</div></div>`;
  }

  const noteKey = `note:${sessionKey}:${blocIdx}:${exIdx}`;
  const chargeKey = `charge:${sessionKey}:${blocIdx}:${exIdx}`;
  const chargeHistKey = `chargeHist:${sessionKey}:${blocIdx}:${exIdx}`;

  // Set tracker — only for standalone exercises with an explicit series count
  // (supersets are tracked at the round level)
  const setsTotal = inSuperset ? 0 : (parseInt(String(stats['Séries'] || '')) || 0);
  const setsRestSec = parseRestSeconds(stats['Repos'] || '');
  const setsBlock = setsTotal > 0 ? `
      <div class="ex-sets" data-sets-key="sets:${sessionKey}:${blocIdx}:${exIdx}" data-sets-total="${setsTotal}" data-rest-seconds="${setsRestSec}" data-rest-label="${escape(ex.name)}">
        <span class="ex-sets-label">Séries</span>
        <div class="ex-sets-dots"></div>
        <button type="button" class="ex-sets-reset" aria-label="Réinitialiser les séries">↺</button>
      </div>` : '';

  // Only show charge tracker if the exercise has a "Charge" stat (skip pure bodyweight)
  const hasCharge = stats['Charge'] && !/poids.{0,5}corps/i.test(stats['Charge']);

  const chargeBlock = hasCharge ? `
    <div class="ex-charge">
      <div class="charge-insight" data-charge-insight="${chargeHistKey}" data-target-charge="${escape(stats['Charge'])}" data-charge-context="${escape([ex.name, ex.sub, stats['Charge']].filter(Boolean).join(' '))}">
        <div class="charge-insight-row">
          <span class="charge-insight-label">Dernière</span>
          <span class="charge-insight-value" data-last-charge="${chargeHistKey}">—</span>
        </div>
        <div class="charge-insight-row">
          <span class="charge-insight-label">Suggestion</span>
          <span class="charge-insight-value suggestion" data-suggest-charge="${chargeHistKey}">Objectif programme : ${escape(stats['Charge'])}</span>
        </div>
      </div>
      <div class="ex-charge-row">
        <div class="ex-charge-label">Charge</div>
        <input type="text" inputmode="decimal" class="ex-charge-input" placeholder="${escape(stats['Charge'])}" data-charge="${chargeKey}" data-hist="${chargeHistKey}">
        <button class="ex-charge-use-last" data-use-last="${chargeKey}" data-hist="${chargeHistKey}">Dernière</button>
        <button class="ex-charge-save" data-charge-save="${chargeKey}" data-hist="${chargeHistKey}">Valider</button>
      </div>
      <div class="ex-charge-history" data-charge-hist-display="${chargeHistKey}"></div>
    </div>
  ` : '';

  return `
    <div class="ex" data-note-key="${noteKey}">
      <div class="ex-head">
        <div class="ex-num">${escape(String(num))}</div>
        <div class="ex-head-text">
          <div class="ex-name">${escape(ex.name)}</div>
          ${ex.sub ? `<div class="ex-sub">${escape(ex.sub)}</div>` : ''}
        </div>
        <div class="ex-note-indicator"></div>
        <div class="ex-chevron">›</div>
      </div>
      <div class="ex-stats cols-${sortedKeys.length}">${statsHtml}</div>
      ${setsBlock}
      ${details ? `<div class="ex-details">${details}</div>` : ''}
      ${chargeBlock}
      <div class="ex-note">
        <div class="ex-note-label">
          <span>Ma note</span>
          <button class="ex-note-clear" data-clear="${noteKey}">Effacer</button>
        </div>
        <textarea placeholder="Sensations, ressenti, \u00e0 retenir\u2026" data-note="${noteKey}"></textarea>
      </div>
    </div>
  `;
}

// ═══ SET TRACKER ═══
// Counts are stored per local day and reset automatically the next day.
function todayLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getSetsCount(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return 0;
    const obj = JSON.parse(raw);
    return obj && obj.d === todayLocal() ? (obj.n || 0) : 0;
  } catch(e) { return 0; }
}

function setSetsCount(key, n) {
  try {
    if (n > 0) localStorage.setItem(key, JSON.stringify({ d: todayLocal(), n }));
    else localStorage.removeItem(key);
  } catch(e) {}
}

function markActivity() {
  if (!currentSessionKey) return;
  try {
    localStorage.setItem('lastDone:' + currentSessionKey, new Date().toISOString());
    const startKey = 'sessionStart:' + currentSessionKey;
    let start = null;
    try { start = JSON.parse(localStorage.getItem(startKey) || 'null'); } catch(e) {}
    if (!start || start.d !== todayLocal()) {
      localStorage.setItem(startKey, JSON.stringify({ d: todayLocal(), t: Date.now() }));
    }
  } catch(e) {}
}

function renderSetDots(container) {
  const key = container.dataset.setsKey;
  const total = parseInt(container.dataset.setsTotal) || 0;
  const count = getSetsCount(key);
  const dotsEl = container.querySelector('.ex-sets-dots');
  if (!dotsEl) return;
  dotsEl.innerHTML = Array.from({ length: total }, (_, i) =>
    `<button type="button" class="set-dot${i < count ? ' done' : ''}" data-idx="${i}" aria-label="Série ${i + 1}">${i < count ? '✓' : i + 1}</button>`
  ).join('');
  const ex = container.closest('.ex');
  if (ex) ex.classList.toggle('sets-done', total > 0 && count >= total);
  dotsEl.querySelectorAll('.set-dot').forEach(dot => {
    dot.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(dot.dataset.idx);
      const cur = getSetsCount(key);
      // Tap a done dot → unfill from there; tap an empty dot → fill up to it
      const next = i < cur ? i : i + 1;
      setSetsCount(key, next);
      if (next > cur) {
        markActivity();
        const restSec = parseInt(container.dataset.restSeconds || '0');
        if (restSec > 0) startRestTimer(restSec, container.dataset.restLabel || 'Repos');
      }
      renderSetDots(container);
      updateSessionProgress();
    });
  });
}

function bindSets() {
  document.querySelectorAll('.ex-sets').forEach(c => {
    renderSetDots(c);
    const resetBtn = c.querySelector('.ex-sets-reset');
    if (resetBtn) {
      resetBtn.addEventListener('click', e => {
        e.stopPropagation();
        setSetsCount(c.dataset.setsKey, 0);
        renderSetDots(c);
        updateSessionProgress();
      });
    }
  });
  updateSessionProgress();
}

function updateSessionProgress() {
  const wrap = document.getElementById('session-progress');
  if (!wrap) return;
  let total = 0, done = 0;
  document.querySelectorAll('#view-session .ex-sets').forEach(c => {
    const t = parseInt(c.dataset.setsTotal) || 0;
    total += t;
    done += Math.min(t, getSetsCount(c.dataset.setsKey));
  });
  if (!total) { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  const fill = document.getElementById('sp-fill');
  const text = document.getElementById('sp-text');
  const time = document.getElementById('sp-time');
  if (fill) fill.style.width = `${Math.round(done / total * 100)}%`;
  if (text) {
    if (done >= total) {
      text.textContent = 'Séance complète ✓';
      text.classList.add('done');
    } else {
      text.textContent = `${done}/${total} séries`;
      text.classList.remove('done');
    }
  }
  if (time) {
    let label = '';
    try {
      const start = JSON.parse(localStorage.getItem('sessionStart:' + currentSessionKey) || 'null');
      if (start && start.d === todayLocal() && done > 0) {
        label = `${Math.max(1, Math.round((Date.now() - start.t) / 60000))} min`;
      }
    } catch(e) {}
    time.textContent = label;
  }
}

let progressTicker = null;
function startProgressTicker() {
  if (progressTicker) clearInterval(progressTicker);
  progressTicker = setInterval(updateSessionProgress, 30000);
}
function stopProgressTicker() {
  if (progressTicker) clearInterval(progressTicker);
  progressTicker = null;
}

// ═══ WAKE LOCK — keep the screen on during a session ═══
let wakeLock = null;
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function releaseWakeLock() {
  if (wakeLock) {
    try { wakeLock.release(); } catch(e) {}
    wakeLock = null;
  }
}
// Re-acquire when coming back to the app (the lock is lost on backgrounding)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && document.body.classList.contains('view-session')) {
    acquireWakeLock();
    updateSessionProgress();
  }
});

// ═══ EXPORT / IMPORT / RESET ═══
function getTrainingStorageData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (/^(note:|charge:|chargeHist:|sets:|lastDone:|sessionStart:|theme$|compactMode$|tabataCfg$)/.test(key)) {
        data[key] = localStorage.getItem(key);
      }
    }
  } catch(e) {}
  return data;
}

function exportTrainingData() {
  const payload = {
    app: 'training-programme',
    version: '1.8',
    exportedAt: new Date().toISOString(),
    data: getTrainingStorageData()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sauvegarde-programme-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importTrainingData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      const data = payload.data || payload;
      Object.keys(data).forEach(key => {
        if (/^(note:|charge:|chargeHist:|sets:|lastDone:|sessionStart:|theme$|compactMode$|tabataCfg$)/.test(key)) {
          localStorage.setItem(key, data[key]);
        }
      });
      alert('Données importées.');
      location.reload();
    } catch(e) {
      alert('Import impossible : fichier JSON invalide.');
    }
  };
  reader.readAsText(file);
}

function resetTrainingData() {
  if (!confirm('Supprimer toutes les notes, charges et séries enregistrées ?')) return;
  try {
    Object.keys(localStorage).forEach(key => {
      if (/^(note:|charge:|chargeHist:|sets:|lastDone:|sessionStart:)/.test(key)) {
        localStorage.removeItem(key);
      }
    });
  } catch(e) {}
  location.reload();
}

// ═══ CHARGE TRACKER ═══
function formatDate(d) {
  const now = new Date();
  const then = new Date(d);
  if (isNaN(then.getTime())) return '';
  const days = Math.max(0, Math.floor((now - then) / (1000 * 60 * 60 * 24)));
  if (days === 0) return "aujourd'hui";
  if (days === 1) return 'hier';
  if (days < 7) return `il y a ${days}j`;
  if (days < 30) return `il y a ${Math.floor(days / 7)}sem`;
  return then.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}


function parseChargeNumber(value) {
  if (!value) return null;
  const s = String(value).replace(',', '.');
  const matches = s.match(/\d+(?:\.\d+)?/g);
  if (!matches || !matches.length) return null;
  // If format is "16-22" or "16–22", use the highest number as target.
  return parseFloat(matches[matches.length - 1]);
}

function inferChargeStep(value, target, context) {
  const s = String([value, target, context].filter(Boolean).join(' ')).toLowerCase();
  if (s.includes('haltère') || s.includes('dumbbell') || s.includes('×2') || s.includes('x2') || s.includes('/main')) return 1;
  if (s.includes('élévation') || s.includes('oiseau') || s.includes('curl')) return 1;
  if (s.includes('poulie') || s.includes('câble') || s.includes('cable')) return 2.5;
  if (s.includes('presse') || s.includes('machine')) return 5;
  if (s.includes('kg')) return 2.5;
  return 1;
}

function formatChargeNumber(n) {
  if (!Number.isFinite(n)) return '';
  const rounded = Math.round(n * 10) / 10;
  return String(rounded).replace('.', ',');
}

function normalizeChargeUnit(original, n) {
  const s = String(original || '').toLowerCase();
  const suffix = (s.includes('×2') || s.includes('x2')) ? ' kg×2' : ' kg';
  return `${formatChargeNumber(n)}${suffix}`;
}

function suggestNextCharge(lastValue, targetValue, context) {
  const last = parseChargeNumber(lastValue);
  if (last == null) return targetValue ? `Objectif programme : ${targetValue}` : '—';
  const step = inferChargeStep(lastValue, targetValue, context);
  const suggested = last + step;
  return `Tente ${normalizeChargeUnit(lastValue || targetValue, suggested)}`;
}

function renderChargeInsight(histKey) {
  const lastEl = document.querySelector(`[data-last-charge="${histKey}"]`);
  const suggestEl = document.querySelector(`[data-suggest-charge="${histKey}"]`);
  const insightEl = document.querySelector(`[data-charge-insight="${histKey}"]`);
  if (!lastEl || !suggestEl || !insightEl) return;
  const target = insightEl.dataset.targetCharge || '';
  const context = insightEl.dataset.chargeContext || '';
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(histKey) || '[]'); } catch(e) {}
  const latest = hist[hist.length - 1];
  if (!latest) {
    lastEl.textContent = 'Aucune charge enregistrée';
    suggestEl.textContent = target ? `Objectif programme : ${target}` : '—';
    return;
  }
  lastEl.textContent = `${latest.v} · ${formatDate(latest.d)}`;
  suggestEl.textContent = suggestNextCharge(latest.v, target, context);
}

function renderChargeHistory(histKey) {
  renderChargeInsight(histKey);
  const displayEl = document.querySelector(`[data-charge-hist-display="${histKey}"]`);
  if (!displayEl) return;
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(histKey) || '[]'); } catch(e) {}
  if (!hist.length) {
    displayEl.innerHTML = '';
    return;
  }
  // Show up to 3 most recent; reversed means index 0 in display = last item in hist
  const total = hist.length;
  const recent = hist.slice(-3).reverse();
  displayEl.innerHTML = recent.map((h, i) => {
    const realIdx = total - 1 - i;
    return `<span class="history-chip" data-hist-key="${histKey}" data-idx="${realIdx}"${i === 0 ? ' data-latest="1"' : ''}><strong>${escape(h.v)}</strong> · ${escape(formatDate(h.d))}</span>`;
  }).join('');

  // Apply latest style via JS since we need to know both state+role
  displayEl.querySelectorAll('.history-chip').forEach(chip => {
    if (chip.dataset.latest === '1') {
      chip.classList.add('latest');
    }
  });

  // Bind click to edit
  displayEl.querySelectorAll('.history-chip').forEach(chip => {
    chip.addEventListener('click', e => {
      e.stopPropagation();
      openChargeEdit(chip.dataset.histKey, parseInt(chip.dataset.idx));
    });
  });
}

function bindCharges() {
  document.querySelectorAll('[data-charge-save]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const key = btn.dataset.chargeSave;
      const histKey = btn.dataset.hist;
      const input = document.querySelector(`[data-charge="${key}"]`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      // Save current value
      try { localStorage.setItem(key, val); } catch(e) {}

      // Append to history — avoid duplicate if same value & same day
      let hist = [];
      try { hist = JSON.parse(localStorage.getItem(histKey) || '[]'); } catch(e) {}
      const today = new Date().toISOString().slice(0, 10);
      const lastEntry = hist[hist.length - 1];
      if (!lastEntry || lastEntry.v !== val || lastEntry.d.slice(0, 10) !== today) {
        hist.push({ v: val, d: new Date().toISOString() });
        // Keep last 20
        if (hist.length > 20) hist = hist.slice(-20);
        try { localStorage.setItem(histKey, JSON.stringify(hist)); } catch(e) {}
      }

      // Visual feedback
      btn.classList.add('saved');
      btn.textContent = 'Enregistré';
      setTimeout(() => {
        btn.classList.remove('saved');
        btn.textContent = 'Valider';
      }, 1500);

      renderChargeHistory(histKey);
    });
  });


  document.querySelectorAll('[data-use-last]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const key = btn.dataset.useLast;
      const histKey = btn.dataset.hist;
      const input = document.querySelector(`[data-charge="${key}"]`);
      let hist = [];
      try { hist = JSON.parse(localStorage.getItem(histKey) || '[]'); } catch(e) {}
      const latest = hist[hist.length - 1];
      if (input && latest && latest.v) {
        input.value = latest.v;
        input.focus();
      }
    });
  });

  // Prevent taps inside input from collapsing the exercise
  document.querySelectorAll('.ex-charge-input').forEach(input => {
    input.addEventListener('click', e => e.stopPropagation());
  });
}

function restoreCharges() {
  document.querySelectorAll('[data-charge]').forEach(input => {
    try {
      const v = localStorage.getItem(input.dataset.charge);
      if (v) input.value = v;
    } catch(e) {}
    renderChargeHistory(input.dataset.hist);
  });
}

// ═══ CHARGE EDIT MODAL ═══
const editBackdrop = document.getElementById('edit-backdrop');
const editInput = document.getElementById('edit-input');
const editSub = document.getElementById('edit-sub');
const editSave = document.getElementById('edit-save');
const editCancel = document.getElementById('edit-cancel');
const editDelete = document.getElementById('edit-delete');
let currentEdit = null; // { histKey, idx }

function openChargeEdit(histKey, idx) {
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(histKey) || '[]'); } catch(e) {}
  if (!hist[idx]) return;
  const entry = hist[idx];
  currentEdit = { histKey, idx };
  editInput.value = entry.v;
  editSub.textContent = formatDate(entry.d);
  editBackdrop.classList.add('active');
  // focus after transition
  setTimeout(() => editInput.focus(), 50);
}

function closeChargeEdit() {
  editBackdrop.classList.remove('active');
  currentEdit = null;
  editInput.blur();
}

editSave.addEventListener('click', () => {
  if (!currentEdit) return;
  const newVal = editInput.value.trim();
  if (!newVal) return;
  const { histKey, idx } = currentEdit;
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(histKey) || '[]'); } catch(e) {}
  if (hist[idx]) {
    hist[idx].v = newVal;
    try { localStorage.setItem(histKey, JSON.stringify(hist)); } catch(e) {}
    // If editing the most recent entry, also update the current-charge storage
    if (idx === hist.length - 1) {
      const chargeKey = histKey.replace('chargeHist:', 'charge:');
      try { localStorage.setItem(chargeKey, newVal); } catch(e) {}
      const input = document.querySelector(`[data-charge="${chargeKey}"]`);
      if (input) input.value = newVal;
    }
    renderChargeHistory(histKey);
  }
  closeChargeEdit();
});

editDelete.addEventListener('click', () => {
  if (!currentEdit) return;
  const { histKey, idx } = currentEdit;
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(histKey) || '[]'); } catch(e) {}
  if (hist[idx] !== undefined) {
    const wasLatest = idx === hist.length - 1;
    hist.splice(idx, 1);
    try {
      if (hist.length) {
        localStorage.setItem(histKey, JSON.stringify(hist));
      } else {
        localStorage.removeItem(histKey);
      }
    } catch(e) {}
    // If we deleted the latest, sync the current-charge value with the new latest (or clear)
    if (wasLatest) {
      const chargeKey = histKey.replace('chargeHist:', 'charge:');
      const input = document.querySelector(`[data-charge="${chargeKey}"]`);
      if (hist.length) {
        const newLatest = hist[hist.length - 1].v;
        try { localStorage.setItem(chargeKey, newLatest); } catch(e) {}
        if (input) input.value = newLatest;
      } else {
        try { localStorage.removeItem(chargeKey); } catch(e) {}
        if (input) input.value = '';
      }
    }
    renderChargeHistory(histKey);
  }
  closeChargeEdit();
});

editCancel.addEventListener('click', closeChargeEdit);

editBackdrop.addEventListener('click', e => {
  if (e.target === editBackdrop) closeChargeEdit();
});

editInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); editSave.click(); }
  if (e.key === 'Escape') closeChargeEdit();
});

// ═══ REST TIMER ═══
let timerInterval = null;
let timerEndTime = 0;
let timerTotalSeconds = 0;
const timerOverlay = document.getElementById('timer-overlay');
const timerLabel = document.getElementById('timer-label');
const timerValue = document.getElementById('timer-value');
const timerExtend = document.getElementById('timer-extend');
const timerReduce = document.getElementById('timer-reduce');
const timerClose = document.getElementById('timer-close');

function formatMS(totalSec) {
  if (totalSec < 0) totalSec = 0;
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function bindRestTimers() {
  document.querySelectorAll('.stat.rest, .superset-footer.timer-ready, .superset-rest-card.timer-ready').forEach(stat => {
    stat.addEventListener('click', e => {
      e.stopPropagation();
      const seconds = parseInt(stat.dataset.restSeconds || '0');
      const label = stat.dataset.restLabel || 'Repos';
      if (seconds > 0) startRestTimer(seconds, label);
    });
  });
}

function startRestTimer(seconds, label) {
  if (timerInterval) clearInterval(timerInterval);
  timerOverlay.classList.remove('done', 'ending');
  timerOverlay.classList.add('active');
  document.body.classList.add('timer-active');
  timerLabel.textContent = label.length > 28 ? label.slice(0, 26) + '…' : label;
  timerTotalSeconds = seconds;
  timerEndTime = Date.now() + seconds * 1000;
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    const remaining = Math.ceil((timerEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerValue.textContent = '00:00';
      timerOverlay.classList.remove('ending');
      timerOverlay.classList.add('done');
      triggerBuzz();
    } else if (remaining <= 5) {
      timerOverlay.classList.add('ending');
      timerValue.textContent = formatMS(remaining);
    } else {
      timerValue.textContent = formatMS(remaining);
    }
  }, 250);
}

function updateTimerDisplay() {
  const remaining = Math.ceil((timerEndTime - Date.now()) / 1000);
  timerValue.textContent = formatMS(remaining);
}

function triggerBuzz() {
  // Pas de son — vibration uniquement (Android ; iOS l'ignore) + signal visuel
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
}



timerReduce.addEventListener('click', () => {
  if (!timerInterval) return;
  const minEnd = Date.now() + 5 * 1000;
  timerEndTime = Math.max(minEnd, timerEndTime - 30 * 1000);
  timerOverlay.classList.remove('ending', 'done');
  updateTimerDisplay();
});
timerExtend.addEventListener('click', () => {
  if (timerInterval) {
    // still running → add 30s
    timerEndTime += 30 * 1000;
    timerOverlay.classList.remove('ending', 'done');
    updateTimerDisplay();
  } else {
    // done → restart with 30s
    startRestTimer(30, timerLabel.textContent);
  }
});

timerClose.addEventListener('click', () => {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timerOverlay.classList.remove('active', 'ending', 'done');
  document.body.classList.remove('timer-active');
});


const exportBtn = document.getElementById('btn-export');
const importBtn = document.getElementById('btn-import');
const compactBtn = document.getElementById('btn-compact');
const resetDataBtn = document.getElementById('btn-reset-data');
const importFile = document.getElementById('import-file');
if (exportBtn) exportBtn.addEventListener('click', exportTrainingData);
if (importBtn && importFile) importBtn.addEventListener('click', () => importFile.click());
if (importFile) importFile.addEventListener('change', e => importTrainingData(e.target.files[0]));

function setCompactMode(active) {
  document.body.classList.toggle('compact-mode', active);
  if (compactBtn) compactBtn.classList.toggle('active', active);
  try { localStorage.setItem('compactMode', active ? '1' : '0'); } catch(e) {}
}
if (compactBtn) {
  compactBtn.addEventListener('click', () => setCompactMode(!document.body.classList.contains('compact-mode')));
}
try { setCompactMode(localStorage.getItem('compactMode') === '1'); } catch(e) {}
if (resetDataBtn) resetDataBtn.addEventListener('click', resetTrainingData);

// ═══ NAVIGATION ═══
function goHome(updateHistory = true) {
  document.body.classList.add('view-home');
  document.body.classList.remove('view-session');
  document.body.style.removeProperty('--accent-color');
  document.getElementById('topbar-title').textContent = 'Programme';
  document.getElementById('view-session').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  stopProgressTicker();
  releaseWakeLock();
  renderHome(); // refresh "dernière séance" on the cards
  window.scrollTo(0, 0);
  // Close timer on navigation back
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timerOverlay.classList.remove('active', 'ending', 'done');
  document.body.classList.remove('timer-active');
  if (updateHistory) { try { history.pushState({ view: 'home' }, '', window.location.pathname + window.location.search); } catch(e) {} }
}

document.getElementById('btn-back').addEventListener('click', goHome);

// Browser/iOS back navigation
window.addEventListener('popstate', e => {
  const state = e.state || { view: 'home' };
  if (state.view === 'session' && state.key && sessions[state.key]) {
    openSession(state.key, false);
  } else if (document.body.classList.contains('view-session')) {
    goHome(false);
  }
});

// ═══ HELPERS ═══
function escape(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ═══ THEME ═══
const themeBtn = document.getElementById('btn-theme');
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☾' : '☀';
  try { localStorage.setItem('theme', t); } catch(e) {}
  // Update status bar meta
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#f2f2f7');
}
themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  setTheme(current === 'dark' ? 'light' : 'dark');
});
// Restore saved theme
try {
  const saved = localStorage.getItem('theme');
  if (saved) setTheme(saved);
  else setTheme('dark');
} catch(e) { setTheme('dark'); }

// ═══ TABATA ═══
const TABATA_DEFAULTS = { prep: 10, work: 20, rest: 10, rounds: 8 };
const TABATA_LIMITS = { prep: [0, 60], work: [5, 300], rest: [0, 300], rounds: [1, 30] };
const TABATA_LABELS = { prep: 'Préparation', work: 'Effort', rest: 'Repos', done: 'Terminé' };
let tabataCfg = { ...TABATA_DEFAULTS };
try { tabataCfg = { ...TABATA_DEFAULTS, ...(JSON.parse(localStorage.getItem('tabataCfg') || '{}')) }; } catch(e) {}

const tabataConfigEl = document.getElementById('tabata-config');
const tabataScreen = document.getElementById('tabata-screen');
const tabataPhaseEl = document.getElementById('tabata-phase');
const tabataCountEl = document.getElementById('tabata-count');
const tabataFillEl = document.getElementById('tabata-fill');
const tabataRoundEl = document.getElementById('tabata-round');
const tabataPauseBtn = document.getElementById('tabata-pause');
const tabataSkipBtn = document.getElementById('tabata-skip');

let tabataTimer = null;
let tabataRun = null; // { phase, round, endTime, dur, paused, pausedLeft }

function saveTabataCfg() {
  try { localStorage.setItem('tabataCfg', JSON.stringify(tabataCfg)); } catch(e) {}
}

function tabataTotalSeconds() {
  return tabataCfg.prep + tabataCfg.work * tabataCfg.rounds + tabataCfg.rest * Math.max(0, tabataCfg.rounds - 1);
}

function renderTabataConfig() {
  document.querySelectorAll('[data-tabata-field]').forEach(el => {
    const f = el.dataset.tabataField;
    el.textContent = f === 'rounds' ? tabataCfg.rounds : `${tabataCfg[f]}s`;
  });
  const total = document.getElementById('tabata-total');
  if (total) total.textContent = `Durée totale : ${formatMS(tabataTotalSeconds())}`;
  const cardMeta = document.getElementById('tabata-card-meta');
  if (cardMeta) cardMeta.textContent = `${tabataCfg.work}s effort · ${tabataCfg.rest}s repos · ${tabataCfg.rounds} rounds`;
}

function openTabataConfig() {
  renderTabataConfig();
  tabataConfigEl.classList.add('active');
}

document.querySelectorAll('[data-tabata-adjust]').forEach(btn => {
  btn.addEventListener('click', () => {
    const [field, deltaStr] = btn.dataset.tabataAdjust.split(':');
    const [min, max] = TABATA_LIMITS[field];
    tabataCfg[field] = Math.min(max, Math.max(min, (tabataCfg[field] || 0) + parseInt(deltaStr)));
    saveTabataCfg();
    renderTabataConfig();
  });
});

function tabataSetPhase(phase) {
  tabataRun.phase = phase;
  const dur = phase === 'prep' ? tabataCfg.prep : phase === 'work' ? tabataCfg.work : tabataCfg.rest;
  tabataRun.dur = Math.max(1, dur);
  tabataRun.endTime = Date.now() + dur * 1000;
  tabataScreen.classList.remove('phase-prep', 'phase-work', 'phase-rest', 'phase-done');
  tabataScreen.classList.add(`phase-${phase}`);
  tabataPhaseEl.textContent = TABATA_LABELS[phase];
  tabataRoundEl.textContent = phase === 'prep'
    ? `${tabataCfg.rounds} rounds à venir`
    : `Round ${tabataRun.round}/${tabataCfg.rounds}`;
  if (navigator.vibrate) navigator.vibrate(phase === 'work' ? 300 : 150);
  tabataRenderTick();
}

function tabataRenderTick() {
  if (!tabataRun || tabataRun.phase === 'done') return;
  const msLeft = Math.max(0, tabataRun.endTime - Date.now());
  const remaining = Math.ceil(msLeft / 1000);
  tabataCountEl.textContent = remaining;
  tabataCountEl.classList.toggle('ending', remaining <= 3 && remaining > 0);
  tabataFillEl.style.width = `${Math.max(0, Math.min(1, msLeft / (tabataRun.dur * 1000))) * 100}%`;
}

function tabataAdvance() {
  const r = tabataRun;
  if (!r || r.phase === 'done') return;
  if (r.phase === 'prep') return tabataSetPhase('work');
  if (r.phase === 'work') {
    if (r.round >= tabataCfg.rounds) return tabataFinish();
    if (tabataCfg.rest <= 0) { r.round++; return tabataSetPhase('work'); }
    return tabataSetPhase('rest');
  }
  // rest → next round
  r.round++;
  tabataSetPhase('work');
}

function tabataLaunch() {
  tabataRun = { round: 1, paused: false };
  tabataPauseBtn.textContent = 'Pause';
  tabataSkipBtn.style.display = '';
  tabataScreen.classList.remove('paused');
  tabataSetPhase(tabataCfg.prep > 0 ? 'prep' : 'work');
  if (tabataTimer) clearInterval(tabataTimer);
  tabataTimer = setInterval(() => {
    if (!tabataRun || tabataRun.paused || tabataRun.phase === 'done') return;
    if (Date.now() >= tabataRun.endTime) tabataAdvance();
    else tabataRenderTick();
  }, 200);
}

function tabataFinish() {
  tabataRun.phase = 'done';
  tabataScreen.classList.remove('phase-prep', 'phase-work', 'phase-rest', 'paused');
  tabataScreen.classList.add('phase-done');
  tabataPhaseEl.textContent = TABATA_LABELS.done;
  tabataCountEl.textContent = '✓';
  tabataCountEl.classList.remove('ending');
  tabataFillEl.style.width = '100%';
  tabataRoundEl.textContent = `${tabataCfg.rounds} rounds · ${formatMS(tabataTotalSeconds())}`;
  tabataPauseBtn.textContent = 'Refaire';
  tabataSkipBtn.style.display = 'none';
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 500]);
}

function tabataStop() {
  if (tabataTimer) clearInterval(tabataTimer);
  tabataTimer = null;
  tabataRun = null;
  tabataScreen.classList.remove('active', 'phase-prep', 'phase-work', 'phase-rest', 'phase-done', 'paused');
  if (!document.body.classList.contains('view-session')) releaseWakeLock();
}

document.getElementById('tabata-start').addEventListener('click', () => {
  saveTabataCfg();
  tabataConfigEl.classList.remove('active');
  tabataScreen.classList.add('active');
  acquireWakeLock();
  tabataLaunch();
});

document.getElementById('tabata-cancel').addEventListener('click', () => {
  tabataConfigEl.classList.remove('active');
});

tabataConfigEl.addEventListener('click', e => {
  if (e.target === tabataConfigEl) tabataConfigEl.classList.remove('active');
});

document.getElementById('tabata-close').addEventListener('click', tabataStop);

tabataPauseBtn.addEventListener('click', () => {
  if (!tabataRun) return;
  if (tabataRun.phase === 'done') return tabataLaunch();
  if (tabataRun.paused) {
    tabataRun.endTime = Date.now() + tabataRun.pausedLeft;
    tabataRun.paused = false;
    tabataPauseBtn.textContent = 'Pause';
    tabataScreen.classList.remove('paused');
  } else {
    tabataRun.pausedLeft = Math.max(0, tabataRun.endTime - Date.now());
    tabataRun.paused = true;
    tabataPauseBtn.textContent = 'Reprendre';
    tabataScreen.classList.add('paused');
  }
});

tabataSkipBtn.addEventListener('click', () => {
  if (!tabataRun || tabataRun.phase === 'done') return;
  if (tabataRun.paused) tabataPauseBtn.click(); // resume before skipping
  tabataAdvance();
});

// ═══ INIT ═══
try { history.replaceState({ view: 'home' }, '', window.location.pathname + window.location.search); } catch(e) {}
renderHome();

const initialKey = window.location.hash.replace('#', '');
if (initialKey && sessions[initialKey]) {
  openSession(initialKey, false);
}
</script>
