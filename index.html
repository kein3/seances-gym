<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<meta name="application-name" content="Training">
<title>Training</title>
<style>
  :root, :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --border: #38383a;
    --text: #ffffff;
    --text-2: #98989f;
    --text-3: #636366;
    --text-4: #48484a;
    --warn-bg: rgba(245, 168, 74, 0.08);
    --warn-border: rgba(245, 168, 74, 0.2);
    --warn-text: #f5a84a;
    --alt-bg: rgba(100, 170, 255, 0.05);
    --alt-border: rgba(100, 170, 255, 0.15);
    --alt-icon: #64aaff;
    --accent: #c03a2b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  :root[data-theme="light"] {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --surface-2: #e9e9ee;
    --border: #e2e2e7;
    --text: #000000;
    --text-2: #515154;
    --text-3: #8e8e93;
    --text-4: #c7c7cc;
    --warn-bg: rgba(200, 110, 20, 0.08);
    --warn-border: rgba(200, 110, 20, 0.25);
    --warn-text: #a8540d;
    --alt-bg: rgba(40, 100, 180, 0.05);
    --alt-border: rgba(40, 100, 180, 0.2);
    --alt-icon: #2d6bb3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    min-height: 100%;
    -webkit-overflow-scrolling: touch;
  }

  /* ══ TOP BAR ══ */
  .topbar {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding-top: var(--safe-top);
    z-index: 10;
  }

  .topbar-row {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
  }

  .btn-back {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface);
    border: none;
    color: var(--text-2);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  body.view-session .btn-back { display: flex; }

  .topbar-title {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topbar-accent {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-color, transparent);
    flex-shrink: 0;
    display: none;
  }

  body.view-session .topbar-accent { display: block; }

  /* ══ MAIN ══ */
  main {
    padding-bottom: calc(24px + var(--safe-bottom));
    transition: padding-bottom 0.3s;
  }

  body.timer-active main {
    padding-bottom: calc(110px + var(--safe-bottom));
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ══ HOME VIEW ══ */
  .home-hero {
    padding: 24px 20px 20px;
  }

  .home-version {
    text-align: center;
    padding: 32px 20px 20px;
    font-size: 11px;
    color: var(--text-4);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .home-hero h1 {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 56px;
    line-height: 0.9;
    letter-spacing: 0.5px;
    color: var(--text);
  }

  .home-hero h1 em {
    font-style: normal;
    color: var(--accent);
    display: block;
  }

  .home-hero p {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-3);
    margin-top: 10px;
  }

  .home-sessions {
    padding: 12px 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .home-tools {
    padding: 0 12px 18px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .home-tool-btn, .session-tool-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    border-radius: 12px;
    padding: 11px 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .home-tool-btn:active, .session-tool-btn:active { background: var(--surface-2); }
  .home-tool-btn.danger { color: #d9534f; }
  .home-tool-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .app-hint {
    margin: 0 12px 14px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text-3);
    font-size: 12px;
    line-height: 1.45;
  }

  @media (max-width: 420px) {
    .home-tools { grid-template-columns: repeat(2, 1fr); }
    .home-hero h1 { font-size: 50px; }
    .session-card { padding: 16px 16px 14px; }
    .ex-head { padding: 13px 14px; }
  }

  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 17px 18px 15px;
    cursor: pointer;
    transition: background 0.12s, transform 0.12s;
    position: relative;
    overflow: hidden;
  }

  .session-card:active {
    background: var(--surface-2);
    transform: scale(0.995);
  }

  .session-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent-color, var(--accent));
  }

  .session-card-name {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.5px;
    line-height: 1;
    color: var(--text);
    margin-bottom: 6px;
  }

  .session-card-meta {
    font-size: 12px;
    color: var(--text-3);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }

  .session-card-meta span {
    white-space: nowrap;
  }

  .session-card-arrow {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-4);
    font-size: 22px;
  }

  /* ══ SESSION VIEW ══ */
  .session-hero {
    padding: 20px 20px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .session-hero::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: var(--accent-color);
  }

  .session-hero h1 {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 42px;
    letter-spacing: 0.5px;
    line-height: 0.95;
    color: var(--text);
  }

  .session-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }

  .session-pill {
    font-size: 11px;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.3px;
  }

  .session-pill.primary {
    color: var(--accent-color);
    border-color: color-mix(in srgb, var(--accent-color) 40%, transparent);
    background: color-mix(in srgb, var(--accent-color) 12%, transparent);
  }

  /* ══ BLOC ══ */
  .bloc {
    padding: 28px 20px 0;
  }

  .bloc-header {
    margin-bottom: 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .bloc-num {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 0.85;
    color: var(--accent-color);
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .bloc-title-group {
    flex: 1;
    padding-top: 4px;
    min-width: 0;
  }

  .bloc-name {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
    line-height: 1.1;
  }

  .bloc-sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 3px;
  }

  .bloc-duration {
    display: inline-block;
    font-size: 11px;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 6px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* ══ EXERCISE CARD ══ */
  .ex {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .ex-head {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .ex-head:active { background: var(--surface-2); }

  .ex-num {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--accent-color);
    font-weight: 400;
    min-width: 24px;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }

  .ex-head-text {
    flex: 1;
    min-width: 0;
  }

  .ex-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.25;
  }

  .ex-sub {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
    line-height: 1.3;
  }

  .ex-chevron {
    color: var(--text-4);
    font-size: 14px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .ex.open .ex-chevron { transform: rotate(90deg); }

  /* Stats — always visible. Flex-based so the last row always fills the width */
  .ex-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }

  .stat {
    background: var(--surface);
    padding: 10px 8px 11px;
    text-align: center;
    flex: 1 1 0;
    min-width: 0;
  }

  /* 5 stats: 3 on top row, 2 on bottom. Force 33% on top 3, 50% on bottom 2 */
  .ex-stats.cols-5 .stat { flex-basis: calc(33.333% - 1px); }
  .ex-stats.cols-5 .stat:nth-child(n+4) { flex-basis: calc(50% - 1px); }

  /* 6 stats: 3+3 */
  .ex-stats.cols-6 .stat { flex-basis: calc(33.333% - 1px); }

  /* 4 stats: 2+2 on narrow screens, 4 on wider */
  .ex-stats.cols-4 .stat { flex-basis: calc(25% - 1px); }

  /* 3 stats: 3 columns */
  .ex-stats.cols-3 .stat { flex-basis: calc(33.333% - 1px); }

  /* 2 stats: half-half */
  .ex-stats.cols-2 .stat { flex-basis: calc(50% - 1px); }

  /* 1 stat: full width */
  .ex-stats.cols-1 .stat { flex-basis: 100%; }

  @media (max-width: 400px) {
    .ex-stats.cols-4 .stat { flex-basis: calc(50% - 1px); }
    .ex-stats.cols-5 .stat { flex-basis: calc(33.333% - 1px); }
    .ex-stats.cols-5 .stat:nth-child(n+4) { flex-basis: calc(50% - 1px); }
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 20px;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.3px;
  }

  .stat.rest .stat-value { color: var(--accent-color); }

  /* Details — collapsible */
  .ex-details {
    display: none;
    padding: 14px 16px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
  }

  .ex.open .ex-details { display: block; }

  .detail-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .detail-text {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.55;
  }

  .detail-block + .detail-block {
    margin-top: 14px;
  }

  .detail-warn {
    display: flex;
    gap: 8px;
    font-size: 12.5px;
    color: var(--warn-text);
    line-height: 1.5;
    padding: 10px 12px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    margin-top: 12px;
  }

  .detail-warn::before {
    content: '⚠';
    flex-shrink: 0;
  }

  .detail-alt {
    display: flex;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.5;
    padding: 10px 12px;
    background: var(--alt-bg);
    border: 1px solid var(--alt-border);
    border-radius: 8px;
    margin-top: 12px;
  }

  .detail-alt::before {
    content: '↻';
    flex-shrink: 0;
    color: var(--alt-icon);
    font-size: 14px;
  }

  .detail-alt strong {
    color: var(--text);
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
  }

  /* ══ SUPERSET ══ */
  .superset {
    margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--accent-color);
    border-radius: 12px;
    overflow: hidden;
  }

  .superset-banner {
    padding: 8px 16px;
    background: var(--accent-color);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }

  .superset-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: color-mix(in srgb, var(--accent-color) 10%, var(--surface));
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-2);
  }

  .superset-rounds {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 22px;
    line-height: 1;
    color: var(--accent-color);
    letter-spacing: 0.6px;
    white-space: nowrap;
  }

  .superset-sequence {
    text-align: right;
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .superset .ex {
    border: none;
    border-radius: 0;
    margin-bottom: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .superset .ex:last-of-type {
    border-bottom: none;
  }

  .superset-footer {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text-2);
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    text-align: center;
  }



  .superset-rest-card {
    width: calc(100% - 24px);
    margin: 10px 12px 12px;
    padding: 12px 14px;
    border: 1px solid color-mix(in srgb, var(--accent-color) 55%, var(--border));
    border-radius: 12px;
    background: color-mix(in srgb, var(--accent-color) 12%, var(--surface-2));
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: center;
    text-align: left;
    -webkit-appearance: none;
  }

  .superset-rest-card:active {
    transform: scale(0.99);
    background: color-mix(in srgb, var(--accent-color) 20%, var(--surface-2));
  }

  .superset-rest-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent-color);
    font-weight: 700;
  }

  .superset-rest-value {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    line-height: 1.35;
  }

  .superset-rest-start {
    grid-row: 1 / span 2;
    grid-column: 2;
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--accent-color);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ══ HYROX SPECIFIC ══ */
  .hyrox-round {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 12px;
  }

  .round-num {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--accent-color);
    line-height: 1;
    align-self: start;
  }

  .round-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .round-part {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .round-part-icon {
    font-size: 18px;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 2px;
  }

  .round-part-info { flex: 1; min-width: 0; }

  .round-part-label {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
  }

  .round-part-val {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
    margin-top: 1px;
  }

  .round-part-sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 3px;
    line-height: 1.4;
  }

  .hyrox-note {
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.5;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 8px 0 12px;
  }

  .amrap-item {
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
  }

  .amrap-item + .amrap-item { margin-top: 0; }

  .amrap-icon {
    font-size: 18px;
    line-height: 1.1;
  }

  .amrap-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
  }

  .amrap-val {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
    margin-top: 1px;
  }

  .amrap-sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .amrap-note {
    font-size: 13px;
    color: var(--accent-color);
    font-weight: 500;
    margin-top: 8px;
    padding: 10px 12px;
    background: color-mix(in srgb, var(--accent-color) 8%, transparent);
    border-radius: 8px;
    text-align: center;
  }

  /* ══ THEME TOGGLE ══ */
  .btn-theme {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface);
    border: none;
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .btn-theme:active { background: var(--surface-2); }

  /* ══ BLOC NAV (sticky below topbar) ══ */
  .bloc-nav {
    position: sticky;
    top: calc(52px + var(--safe-top));
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .bloc-nav::-webkit-scrollbar { display: none; }

  .bloc-nav-btn {
    flex-shrink: 0;
    min-width: 44px;
    height: 40px;
    padding: 0 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-2);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .bloc-nav-btn .num {
    color: var(--accent-color);
    font-size: 18px;
  }

  .bloc-nav-btn.active {
    background: var(--accent-color);
    border-color: var(--accent-color);
    color: #fff;
  }

  .bloc-nav-btn.active .num {
    color: #fff;
  }

  .bloc {
    scroll-margin-top: calc(52px + 56px + var(--safe-top));
  }

  /* ══ NOTES ══ */
  .ex-note-indicator {
    display: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-color);
    flex-shrink: 0;
    margin-right: 2px;
  }

  .ex.has-note .ex-note-indicator { display: block; }

  .ex-note {
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    padding: 12px 16px;
  }

  .ex-note-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ex-note-clear {
    background: none;
    border: none;
    color: var(--text-3);
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
  }

  .ex-note-clear:active { color: var(--text); }

  .ex-note textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 12px;
    resize: vertical;
    min-height: 60px;
    outline: none;
    -webkit-appearance: none;
  }

  .ex-note textarea:focus {
    border-color: var(--accent-color);
  }

  /* ══ REST TIMER BUTTON (inline in stats row) ══ */
  .stat.rest {
    cursor: pointer;
    position: relative;
    transition: background 0.12s;
  }

  .stat.rest:active { background: var(--surface-2); }

  .stat.rest::after {
    content: '▶';
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 8px;
    color: var(--accent-color);
    opacity: 0.6;
  }


  .stat.rest {
    border: 1px solid color-mix(in srgb, var(--accent-color) 45%, var(--border));
    background: color-mix(in srgb, var(--accent-color) 8%, var(--surface));
  }

  .rest-start-chip {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--accent-color);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    line-height: 1;
  }

  .superset-footer.timer-ready {
    cursor: pointer;
    color: #fff;
    background: color-mix(in srgb, var(--accent-color) 80%, var(--surface-2));
    border-top-color: var(--accent-color);
    font-weight: 600;
  }

  .superset-footer.timer-ready::after {
    content: '  ▶';
    font-size: 10px;
  }

  /* ══ CHARGE TRACKER ══ */
  .ex-charge {
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    padding: 12px 16px;
  }

  .ex-charge-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ex-charge-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    flex-shrink: 0;
  }

  .ex-charge-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.5px;
    padding: 6px 12px;
    outline: none;
    -webkit-appearance: none;
    text-align: center;
    min-width: 0;
  }

  .ex-charge-input:focus { border-color: var(--accent-color); }

  .ex-charge-input::placeholder {
    color: var(--text-4);
    font-family: inherit;
  }

  .ex-charge-use-last {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-2);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    padding: 8px 10px;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
  }

  .ex-charge-use-last:active { background: var(--surface-2); }

  .ex-charge-save {
    background: var(--accent-color);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 8px 14px;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
  }

  .ex-charge-save:active { opacity: 0.7; }

  .ex-charge-save.saved {
    background: var(--surface);
    color: var(--text-3);
    border: 1px solid var(--border);
  }

  .ex-charge-history {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .ex-charge-history:empty { display: none; }


  .charge-insight {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    margin-bottom: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
  }

  .charge-insight-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    font-size: 12px;
    color: var(--text-3);
  }

  .charge-insight-label {
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 9px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .charge-insight-value {
    color: var(--text-2);
    text-align: right;
    font-weight: 600;
  }

  .charge-insight-value.suggestion {
    color: var(--accent-color);
  }

  .history-chip {
    font-size: 11px;
    color: var(--text-3);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  .history-chip:active {
    background: var(--surface-2);
  }

  .history-chip.editing {
    border-color: var(--accent-color);
    background: color-mix(in srgb, var(--accent-color) 10%, var(--surface));
  }

  .history-chip.deleting {
    border-color: #d9534f;
    background: color-mix(in srgb, #d9534f 15%, var(--surface));
    color: #d9534f;
  }

  .history-chip.deleting strong { color: #d9534f; }

  .history-chip strong {
    color: var(--text-2);
    font-weight: 600;
  }

  /* ══ EDIT DIALOG for charge history ══ */
  .edit-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 20px;
    padding-bottom: calc(20px + var(--safe-bottom));
  }

  .edit-backdrop.active { display: flex; }

  .edit-panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .edit-title {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .edit-sub {
    font-size: 12px;
    color: var(--text-3);
    margin-top: -10px;
  }

  .edit-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.5px;
    padding: 12px 16px;
    outline: none;
    -webkit-appearance: none;
    text-align: center;
  }

  .edit-input:focus { border-color: var(--accent-color); }

  .edit-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .edit-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    -webkit-appearance: none;
    font-family: inherit;
  }

  .edit-btn.primary {
    background: var(--accent-color);
    color: #fff;
    border-color: var(--accent-color);
  }

  .edit-btn.danger {
    color: #d9534f;
    border-color: color-mix(in srgb, #d9534f 40%, var(--border));
  }

  .edit-btn:active { opacity: 0.7; }

  .history-chip.latest strong {
    color: var(--accent-color);
  }

  /* ══ TIMER OVERLAY ══ */
  .timer-overlay {
    position: fixed;
    bottom: calc(16px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(200%);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.2s, visibility 0s 0.3s;
    visibility: hidden;
    opacity: 0;
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    min-width: 260px;
    max-width: calc(100% - 24px);
    pointer-events: none;
  }

  .timer-overlay.active {
    transform: translateX(-50%) translateY(0);
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.2s, visibility 0s;
  }

  /* Always hide timer when on home view */
  body.view-home .timer-overlay {
    display: none !important;
  }

  .timer-overlay.ending {
    animation: pulseBg 0.6s ease-in-out infinite alternate;
  }

  @keyframes pulseBg {
    from { box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
    to { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-color) 40%, transparent), 0 10px 40px rgba(0,0,0,0.4); }
  }

  .timer-overlay.done .timer-value {
    color: var(--accent-color);
  }

  .timer-info {
    flex: 1;
    min-width: 0;
  }

  .timer-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    line-height: 1;
    margin-bottom: 4px;
  }

  .timer-value {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    font-weight: 800;
    font-size: 36px;
    line-height: 0.9;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }

  .timer-close {
    background: var(--surface-2);
    border: none;
    color: var(--text-2);
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
  }

  .timer-close:active { background: var(--border); }

  .timer-adjust {
    background: var(--surface-2);
    border: none;
    color: var(--text-2);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .timer-adjust.primary {
    background: var(--accent-color);
    border: none;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .timer-adjust:active { opacity: 0.75; }



  /* ══ COMPACT MODE ══ */
  body.compact-mode .session-hero { padding: 14px 16px 16px; }
  body.compact-mode .session-hero h1 { font-size: 34px; }
  body.compact-mode .session-pills { display: none; }
  body.compact-mode .bloc { padding-top: 18px; }
  body.compact-mode .bloc-header { margin-bottom: 10px; }
  body.compact-mode .bloc-num { font-size: 34px; }
  body.compact-mode .bloc-name { font-size: 20px; }
  body.compact-mode .bloc-sub,
  body.compact-mode .bloc-duration { display: none; }
  body.compact-mode .ex { border-radius: 10px; margin-bottom: 8px; }
  body.compact-mode .ex-head { padding: 11px 13px; }
  body.compact-mode .ex-name { font-size: 14px; }
  body.compact-mode .ex-sub { display: none; }
  body.compact-mode .stat { padding: 8px 6px 9px; }
  body.compact-mode .stat-label { font-size: 8px; }
  body.compact-mode .stat-value { font-size: 18px; }
  /* En compact, les détails restent accessibles en développant l'exercice */
  body.compact-mode .ex:not(.open) .ex-note { display: none; }
  body.compact-mode .charge-insight { padding: 8px 10px; margin-bottom: 8px; }
  body.compact-mode .ex-charge { padding: 10px 12px; }
  body.compact-mode .ex-charge-history { display: none; }

  /* ══ SET TRACKER ══ */
  .ex-sets {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 12px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .ex-sets-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 600;
    flex-shrink: 0;
    margin-right: 2px;
  }

  .ex-sets-dots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .set-dot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text-3);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-appearance: none;
    font-variant-numeric: tabular-nums;
    transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.12s;
  }

  .set-dot:active { transform: scale(0.92); }

  .set-dot.done {
    background: var(--accent-color);
    border-color: var(--accent-color);
    color: #fff;
  }

  .ex-sets-reset {
    margin-left: auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: none;
    border: none;
    color: var(--text-4);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-appearance: none;
  }

  .ex-sets-reset:active { color: var(--text-2); }

  .ex.sets-done .ex-num { color: var(--text-4); }
  .ex.sets-done .ex-name {
    color: var(--text-3);
    text-decoration: line-through;
    text-decoration-color: var(--text-4);
  }

  .ex-sets.superset-sets {
    padding: 10px 14px 12px;
    background: color-mix(in srgb, var(--accent-color) 6%, var(--surface));
  }

  /* ══ SESSION PROGRESS ══ */
  .session-progress { margin-top: 14px; }
  .session-progress.hidden { display: none; }

  .session-progress-track {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .session-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent-color);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .session-progress-text {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .session-progress-text .done {
    color: var(--accent-color);
    font-weight: 600;
  }

  .session-card-meta .last-done {
    color: var(--accent-color, var(--accent));
    font-weight: 600;
  }

  body.compact-mode .ex-sets { padding: 8px 12px 10px; }
  body.compact-mode .set-dot { width: 32px; height: 32px; font-size: 12px; }
  body.compact-mode .session-progress { margin-top: 10px; }

  /* ══ Responsive tweaks ══ */
  @media (min-width: 600px) {
    main { max-width: 720px; margin: 0 auto; }
  }

  /* ══ iOS SKIN — typographie SF, surfaces iOS, barres floutées ══ */
  .topbar {
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom-color: color-mix(in srgb, var(--border) 55%, transparent);
  }

  .bloc-nav {
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }

  .topbar-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }

  .home-hero h1 { font-size: 34px; line-height: 1.12; letter-spacing: -0.6px; }
  .home-hero p { letter-spacing: 1.2px; }
  .session-hero h1 { font-size: 28px; line-height: 1.1; letter-spacing: -0.5px; }

  @media (min-width: 600px) {
    .home-hero h1 { font-size: 42px; }
    .session-hero h1 { font-size: 34px; }
  }

  /* Cartes de séance façon liste de conversations */
  .session-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 38px 12px 14px;
    border-radius: 20px;
  }
  .session-card::before { display: none; }
  .session-card-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--accent-color, var(--accent));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .session-card-body { flex: 1; min-width: 0; }
  .session-card-name { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 3px; }
  .session-card-meta { font-size: 13px; }
  @media (max-width: 420px) {
    .session-card { padding: 12px 36px 12px 12px; }
  }

  /* Tailles ex-Bebas recalibrées pour SF */
  .session-card-name,
  .topbar-title { font-weight: 700; }
  .bloc-num { font-size: 26px; line-height: 1; letter-spacing: -0.4px; }
  .bloc-name { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .bloc-title-group { padding-top: 2px; }
  .ex-num { font-size: 15px; font-weight: 700; min-width: 22px; }
  .stat-value { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
  .superset-rounds { font-size: 15px; font-weight: 800; }
  .round-num { font-size: 22px; }
  .bloc-nav-btn { font-size: 13px; font-weight: 600; letter-spacing: -0.1px; border-radius: 12px; }
  .bloc-nav-btn .num { font-size: 14px; font-weight: 800; }
  .timer-value { font-size: 32px; letter-spacing: -0.4px; }
  .edit-title { font-size: 17px; font-weight: 700; }
  .edit-input { font-size: 22px; font-weight: 700; }
  .ex-charge-input { font-size: 16px; font-weight: 600; }
  body.compact-mode .session-hero h1 { font-size: 24px; }
  body.compact-mode .bloc-num { font-size: 22px; }
  body.compact-mode .bloc-name { font-size: 15px; }
  body.compact-mode .stat-value { font-size: 14px; }

  /* Rayons et surfaces plus doux */
  .ex { border-radius: 16px; }
  .superset { border-radius: 16px; }
  .timer-overlay {
    border-radius: 24px;
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }
  .edit-panel { border-radius: 22px; }
  .home-tool-btn { border-radius: 14px; }

  /* ══ TABATA ══ */
  .tabata-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .tabata-row-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .tabata-stepper {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .tabata-step-btn {
    width: 42px;
    height: 40px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 22px;
    font-weight: 500;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .tabata-step-btn:active { background: var(--surface-2); }

  .tabata-step-val {
    min-width: 54px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .tabata-total {
    text-align: center;
    font-size: 13px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .tabata-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--bg);
    color: #fff;
    text-align: center;
    padding: 20px;
    padding-top: calc(20px + var(--safe-top));
    padding-bottom: calc(20px + var(--safe-bottom));

  }

  .tabata-screen.phase-prep { background: #0a84ff; }
  .tabata-screen.phase-work { background: #ff375f; }
  .tabata-screen.phase-rest { background: #30b350; }
  .tabata-screen.phase-done { background: #1c1c1e; }

  .tabata-close {
    position: absolute;
    top: calc(16px + var(--safe-top));
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: none;
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .tabata-phase {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.85;

  .tabata-count {
    font-size: 130px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;

  .tabata-screen.paused .tabata-count { opacity: 0.35; }

  .tabata-count.ending {
    animation: tabataPulse 0.5s ease-in-out infinite alternate;
  }

  @keyframes tabataPulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }

  .tabata-progress {

    border-radius: 999px;
    background: rgba(255,255,255,0.25);

  .tabata-progress-fill {

  .tabata-round {
    font-size: 15px;

  .tabata-controls {

arge": "20–25 kg", "Repos": "45 sec"}}], "supersets": [{"exercises": [{"name": "Curl Haltères Alterné", "sub": "Haltères · Debout", "execution": "Monte un bras à la fois. Effectue une supination progressive (tourne la paume vers le ciel en montant). Coude fixe contre le corps — ne le projette pas en avant.", "avoid": "Pas d'élan du buste pour compenser.", "alt": {"label": "Alternative", "text": "Curl barre EZ debout : même rep range, charge ~30–35 kg. Moins d'isolation par côté mais utile si haltères libres occupés."}, "stats": {"Reps": "10", "Charge": "12–16 kg"}}, {"name": "Curl Marteau", "sub": "Haltères · Prise neutre", "execution": "Pouce vers le haut tout au long du mouvement, pas de rotation. Mouvement lent et contrôlé. Tiens la contraction 1 sec en haut. Cible le brachial et le long supinateur — donne l'épaisseur.", "avoid": "Ne retourne pas la paume en chemin — garde la prise neutre.", "alt": {"label": "Alternative", "text": "Curl marteau à la corde poulie basse : tension constante sur tout l'arc, excellent si haltères libres sont tous pris. ~15–20 kg câble, même rep range."}, "stats": {"Reps": "10", "Charge": "14–18 kg"}}], "rest": "Repos entre les rounds : 75 sec"}]}]}, "bas": {"title": "Bas du corps", "pills": ["⏱ 60 min chrono", "Niveau avancé", "Force + Hypertrophie", "🦵 Genoux sensibles"], "blocs": [{"chip": "Bloc 01", "name": "Force", "duration": "~22 min · repos 2'30–3'", "exercises": [{"name": "Squat Barre — Back Squat", "sub": "Barre libre · Rack · Profondeur contrôlée", "execution": "Pieds largeur d'épaules, légèrement ouverts (15–30°). Barre posée sur les trapèzes moyens (low bar) ou hauts (high bar — genoux plus sollicités). Descends en poussant les genoux dans l'axe des orteils, buste légèrement incliné, dos gaîné. Descend jusqu'à la parallèle ou juste en dessous selon le confort.", "avoid": "Ne laisse pas les genoux s'effondrer vers l'intérieur (valgus) sous la charge — c'est le premier facteur de blessure.", "alt": {"label": "Alternative si rack occupé ou douleur", "text": "Squat goblet avec kettlebell ou haltère (~20–30 kg) : tenu contre la poitrine, favorise un buste droit et réduit la pression sur les genoux. Ou presse à cuisses pieds hauts (voir exo 3) comme remplacement direct."}, "stats": {"Séries": "4", "Reps": "5–6", "Charge": "80–100 kg", "Repos": "3 min"}}, {"name": "Romanian Deadlift", "sub": "Barre libre · Ischio-jambiers + Fessiers", "execution": "Debout, barre en pronation dans les mains. Descends la barre le long des jambes en poussant les hanches vers l'arrière (hip hinge), jambes quasi tendues (légère flexion genou). Sens l'étirement maximal des ischios avant de remonter en contractant les fessiers. Dos strictement plat tout au long.", "avoid": "Ne laisse pas le bas du dos s'arrondir en bas du mouvement — arrête-toi quand tu sens la limite de ton étirement ischio.", "alt": {"label": "Alternative si barre occupée", "text": "Romanian deadlift haltères : exactement le même mouvement, 2 haltères (~25–35 kg chacun). Amplitude souvent meilleure car les haltères passent à l'extérieur des jambes. Même charges et reps."}, "stats": {"Séries": "4", "Reps": "6–8", "Charge": "70–90 kg", "Repos": "2'30"}}], "supersets": []}, {"chip": "Bloc 02", "name": "Hypertrophie", "duration": "~18 min · repos 90 sec", "exercises": [{"name": "Presse à Cuisses — Pieds Hauts", "sub": "Machine guidée · Fessiers + Ischios prioritaires", "execution": "Place les pieds en haut de la plateforme (largeur d'épaules). Cette position haute réduit la flexion du genou et transfère le travail vers les fessiers et ischios. Descends jusqu'à 90° de flexion max — les lombaires ne doivent pas décoller du dossier. Remonte sans verrouiller les genoux en haut.", "avoid": "Ne décolle pas les fessiers du siège en fin de descente — ça transfère la charge sur les lombaires.", "alt": {"label": "Alternative si machine occupée", "text": "Squat bulgare haltères (exo 4 ci-dessous peut être avancé) ou Squat goblet à la kettlebell 4×12 (~25–30 kg) : buste droit, profondeur confortable. Moins de charge mais stimulus hypertrophique similaire."}, "stats": {"Séries": "3", "Reps": "10–12", "Charge": "120–160 kg", "Repos": "90 sec"}}, {"name": "Leg Curl Couché", "sub": "Machine · Ischio-jambiers · Isolation", "execution": "Allongé ventre sur la machine. Le coussin doit être au niveau des chevilles (pas du mollet). Fléchis en ramenant les talons vers les fesses, pause 1 sec en contraction maximale, redescends en 3 secondes. Garde les hanches en contact avec la machine — ne les soulève pas pour aider.", "avoid": "Ne soulève pas les hanches pour compenser — ça sort les ischios du travail et compresse les lombaires.", "alt": {"label": "Alternative si machine occupée", "text": "Nordic curl au sol (genou à terre, partenaire ou barre fixe qui bloque les chevilles) : descends en freinant avec les ischios, remonte en poussant avec les mains. Très intense — 3×6–8 suffit. Ou good morning barre légère (~30–40 kg) 3×12."}, "stats": {"Séries": "3", "Reps": "10–12", "Charge": "35–50 kg", "Repos": "90 sec"}}, {"name": "Fentes Bulgares Haltères", "sub": "Haltères · Pied arrière surélevé · Unilatéral", "execution": "Pied arrière posé sur un banc (~genou fléchi à 90°). Pied avant avancé suffisamment pour que le genou avant ne dépasse pas la pointe du pied en descendant. Descends verticalement, buste droit. Remonte en poussant sur le talon avant — sens le fessier et le quadri travailler.", "avoid": "Ne laisse pas le genou avant s'effondrer vers l'intérieur — garde le genou dans l'axe du 2e orteil tout au long du mouvement.", "alt": {"label": "Alternative si douleur ou déséquilibre", "text": "Fente avant marchée haltères (~12–16 kg/main) : même stimulus, plus de contrôle sur la trajectoire du genou. Ou hip thrust à la barre pour fessiers (voir bloc finition). 3×12 pas/jambe."}, "stats": {"Séries": "3", "Reps": "10/jambe", "Charge": "16–22 kg×2", "Repos": "90 sec"}}], "supersets": []}, {"chip": "Bloc 03", "name": "Finition", "duration": "~10 min · repos 45–60 sec", "exercises": [{"name": "Leg Extension — Amplitude Réduite", "sub": "Machine · Quadriceps · Charge légère", "execution": "Charge légère — l'objectif est la congestion, pas la force. Travaille en amplitude partielle : de 90° à environ 45° de flexion (pas jusqu'à extension complète). Cela évite la zone de tension maximale sur le tendon rotulien. Reps lentes, contraction de 1 sec à chaque rep.", "avoid": "Ne charge pas lourd sur cet exercice avec des genoux sensibles — c'est un exercice de finition, pas de force.", "alt": {"label": "Alternative si douleur ou machine indisponible", "text": "Wall sit isométrique : dos au mur, cuisses parallèles au sol, 3×30–45 sec. Ou terminal knee extension avec élastique : debout, élastique derrière le genou, petites extensions finales à 20°. Parfait pour les genoux sensibles."}, "stats": {"Séries": "3", "Reps": "15", "Charge": "25–35 kg", "Amplitude": "Partielle", "Repos": "60 sec"}}, {"name": "Mollets Debout", "sub": "Machine ou barre sur trapèzes · Gastrocnémiens", "execution": "Avant-pieds sur une marche ou plateforme. Descends talons vers le bas pour un étirement maximal (2 sec), remonte sur la pointe des pieds en 1 sec, pause 1 sec en haut avec contraction. Les mollets sont des muscles résistants — ils ont besoin d'amplitude complète et de volume pour progresser.", "avoid": "Ne fais pas des mini-reps avec juste le talon qui monte légèrement — l'amplitude complète est ce qui crée l'hypertrophie sur les mollets.", "alt": {"label": "Alternative si machine occupée", "text": "Mollets à la presse à cuisses : pieds en bas de la plateforme, pousse sur la pointe des pieds sans déverrouiller la sécurité. Ou mollets debout 1 jambe avec haltère (~20 kg) pour plus d'intensité et d'équilibre."}, "stats": {"Séries": "4", "Reps": "15–20", "Charge": "60–80 kg", "Tempo": "2-1-1", "Repos": "45 sec"}}], "supersets": []}]}, "hyrox": {"title": "Hyrox · Parc", "pills": ["⏱ 60 min", "🌳 Sans matériel · Parc", "Débutant · 1ère prépa", "Cardio + Force fonctionnelle"], "blocs": [{"chip": "Bloc 01", "name": "Simulation Hyrox", "sub": "4 rounds · Course + Station", "duration": "~28 min", "icon": "🏁", "exercises": [], "supersets": [], "sim_title": "⚡ 4 Rounds — Boucle 400m → Retour base camp → Station Toutes les stations se font à ton point fixe sur la pelouse · Allure course : tu dois pouvoir parler", "rounds": [{"num": "1", "run_icon": "🏃", "run_label": "Course", "run_val": "400 m", "st_icon": "💥", "st_label": "Station 1 — Pompes explosives", "st_val": "10 reps", "st_sub": "Pousse assez fort pour décoller les mains du sol · claque des mains si possible · simulation poussée explosive Hyrox"}, {"num": "2", "run_icon": "🏃", "run_label": "Course", "run_val": "400 m", "st_icon": "🔥", "st_label": "Station 2 — Mountain climbers", "st_val": "40 reps (20/jambe)", "st_sub": "Rythme rapide, hanches basses, épaules au-dessus des mains · simulation ski erg cadence"}, {"num": "3", "run_icon": "🏃", "run_label": "Course", "run_val": "400 m", "st_icon": "⚡", "st_label": "Station 3 — Sprint 50m aller-retour", "st_val": "3 allers-retours", "st_sub": "Depuis le point fixe · effort 90% · simulation des changements de rythme Hyrox"}, {"num": "4", "run_icon": "🏃", "run_label": "Course", "run_val": "400 m", "st_icon": "🦘", "st_label": "Station 4 — Sauts en longueur enchaînés", "st_val": "8 sauts", "st_sub": "Saute le plus loin possible, enchaîne sans pause entre chaque saut · travail puissance + coordination"}], "sim_footer": "Total : 1600m de course + 4 stations à ton point fixe Entre les rounds : 90 sec max de marche — reste près de ton point fixe"}, {"chip": "Bloc 02", "name": "Renforcement Fonctionnel", "sub": "Zones clés Hyrox · Sur la pelouse · Point fixe", "duration": "~15 min · repos 60 sec", "icon": "💪", "exercises": [{"name": "Pompes — Tempo 2-1-1", "sub": "Poids de corps · Pectoraux + Triceps + Gainage", "execution": "Corps droit de la tête aux talons, mains légèrement plus larges que les épaules. Descends en 2 sec, pause 1 sec en bas (coudes à ~75°), remonte en 1 sec. Gaîne l'abdomen — si le bas du dos se creuse, pose les genoux. La qualité prime sur la quantité.", "avoid": "Ne laisse pas les hanches s'affaisser — ton corps doit former une planche rigide.", "stats": {"Séries": "3", "Reps": "12–15", "Tempo": "2-1-1", "Repos": "60 sec"}}, {"name": "Glute Bridge — Unilatéral", "sub": "Sol · Fessiers + Ischios · Pied opposé en l'air", "execution": "Allongé sur le dos, un pied à plat, l'autre jambe tendue en l'air. Pousse sur le talon, monte les hanches jusqu'à alignement épaule-genou-cheville, contraction fessier 2 sec en haut. Redescends lentement. Travail unilatéral = correction des déséquilibres très fréquents chez les coureurs.", "avoid": "Ne laisse pas les hanches basculer de côté quand tu montes — maintiens le bassin horizontal.", "stats": {"Séries": "3", "Reps": "12/côté", "Pause": "2 sec en haut", "Repos": "60 sec"}}, {"name": "Planche + Shoulder Taps", "sub": "Sol · Gainage global · Stabilité", "execution": "Position planche sur les mains. Alterne en touchant l'épaule opposée avec la main, sans laisser les hanches bouger. Place les pieds légèrement plus larges que les épaules pour plus de stabilité. Respire normalement — le but est de maintenir l'effort sous tension continue, comme en condition Hyrox.", "avoid": "Ne laisse pas les hanches monter en l'air ou descendre — reste parfaitement horizontal.", "stats": {"Séries": "3", "Taps": "20/côté", "Repos": "60 sec"}}], "supersets": []}, {"chip": "Bloc 03", "name": "AMRAP Finition", "sub": "As Many Rounds As Possible · 5 min · À ton point fixe", "duration": "~5 min", "icon": "🔁", "exercises": [], "supersets": [], "amrap": {"header": "🔁 AMRAP 5 min — Enchaîne en boucle Pas de repos · Réduis l'intensité si besoin mais ne t'arrête pas", "movements": [{"icon": "💥", "label": "Mouvement A", "val": "5 Burpees", "sub": "Saut en extension complète"}, {"icon": "🦵", "label": "Mouvement B", "val": "10 Squat jumps", "sub": "Bras tendus en haut"}, {"icon": "🏃", "label": "Mouvement C", "val": "200 m sprint", "sub": "Effort 80% — pas à fond"}], "footer": "Note le nombre de rounds complets — c'est ton score à battre la prochaine fois 🎯 Objectif débutant : 3–4 rounds"}}]}, "calisthenie": {"title": "Calisthénie · Full Body", "pills": ["⏱ ~60 min chrono", "🤸 Poids de corps · Barre + Sol", "Niveau avancé · ~70 kg", "Skills + Force + Gainage"], "blocs": [{"chip": "Bloc 01", "name": "Skills à froid", "sub": "Équilibre + Tirage explosif · Système nerveux frais", "duration": "~20 min · repos 2–3 min", "icon": "🤸", "exercises": [{"name": "Handstand — Travail au mur", "sub": "Poids de corps · Mur · Équilibre + Gainage épaules", "execution": "Travaille à froid quand le système nerveux est frais — l'équilibre est une compétence, pas un effort de force. Monte en appui tendu renversé face au mur (ventre vers le mur, idéal pour aligner le corps) ou dos au mur. Cherche l'alignement poignets-épaules-bassin-chevilles : pousse activement le sol, monte les épaules vers les oreilles (protraction), gaine l'abdomen et serre les fessiers pour éviter la cambrure. Vise des maintiens de 20–40 sec propres plutôt que des longues tenues affaissées.", "avoid": "Ne cambre pas le bas du dos (banane) pour compenser un manque d'alignement — c'est la première cause de chute en arrière et ça surcharge les lombaires.", "alt": {"label": "Alternative si poignets sensibles ou pas de mur", "text": "Pike push-up pieds surélevés sur banc : buste à la verticale, descends le sommet du crâne vers le sol entre les mains. Travaille la même poussée verticale épaules sans la contrainte d'équilibre. 4×6–10. Ou wall walk : pieds au mur, marche progressivement vers la position verticale."}, "stats": {"Séries": "5", "Durée": "20–40 sec", "Repos": "2 min"}}, {"name": "Muscle-up — Progression", "sub": "Barre de traction · Transition tirage → poussée · Explosivité", "execution": "Le mouvement le plus technique de la séance, donc placé en premier. Travaille la transition par étapes : tractions explosives (tire la barre vers le bas des pecs, le plus haut possible), puis high pull (amène la barre vers le bas du sternum/abdomen avec une légère bascule du buste). Au sommet du tirage, bascule rapidement les poignets par-dessus la barre et enchaîne un dip. Prise pronation, légèrement plus large que les épaules. Si tu as déjà le muscle-up, fais des reps strictes contrôlées sans kipping.", "avoid": "N'essaie pas de forcer la transition avec les bras à mi-hauteur — si tu ne tires pas assez haut (barre au-dessus du nombril), la bascule est impossible et tu risques l'épaule. Monte d'abord, bascule ensuite.", "alt": {"label": "Alternative si pas encore acquis", "text": "Tractions explosives lestées (vise une amplitude maximale, barre vers le bas des pecs) 5×3–5 + négatives de muscle-up : pars du haut du dip, descends lentement en 4–5 sec à travers la transition. Excellent pour construire la force de la zone morte."}, "stats": {"Séries": "5", "Reps": "3–5", "Charge": "Poids de corps", "Repos": "2'30"}}], "supersets": []}, {"chip": "Bloc 02", "name": "Poussée", "sub": "Dips lestés + Pompes avancées", "duration": "~15 min · repos 90 sec", "icon": "💥", "exercises": [{"name": "Dips Lestés", "sub": "Barres parallèles · Ceinture de lest · Pecs inférieurs + Triceps", "execution": "Avec une ceinture de lest (ou haltère entre les chevilles). Buste légèrement penché en avant pour cibler les pectoraux, ou plus droit pour accentuer les triceps. Descends en contrôlant jusqu'à ce que les épaules passent sous les coudes, remonte sans verrouiller complètement en haut pour garder la tension. C'est le mouvement de force de poussée principal — soigne la charge progressive.", "avoid": "Ne descends pas trop bas si tu ressens une gêne à l'épaule antérieure — la zone basse est articulairement exigeante sous charge. Arrête-toi quand les bras sont parallèles au sol si besoin.", "alt": {"label": "Alternative si pas de barres ou de lest", "text" mplitude en haut (demi-reps) ni en bas (rebond) — une traction lestée vaut par sa rigueur. Si tu n'atteins pas l'amplitude complète, réduis le lest.", "alt": {"label": "Alternative si pas de lest", "text": "Tractions au poids de corps tempo 3-1-1 (3 sec de descente, 1 sec en bas, 1 sec de montée) avec reps supplémentaires, ou tractions archer (tire le corps vers un bras, l'autre bras tendu sur la barre) pour augmenter l'intensité unilatérale. 4×6–8 par côté."}, "stats": {"Séries": "4", "Reps": "5–8", "Charge": "+5–15 kg", "Repos": "90 sec"}}, {"name": "Front Lever — Progression", "sub": "Barre · Gainage horizontal · Grand dorsal + Abdos", "execution": "Suspendu à la barre, l'objectif est de tenir le corps horizontal, parallèle au sol, face vers le ciel. Travaille la progression adaptée à ton niveau : tuck (genoux repliés contre la poitrine), puis advanced tuck (dos plat, genoux moins repliés), puis one-leg (une jambe tendue). Tire la barre vers les hanches avec les bras tendus (dépression scapulaire active), gaine fortement l'abdomen et serre les fessiers pour garder la ligne. Maintiens des tenues propres de 5–15 sec.", "avoid": "Ne laisse pas le bassin s'affaisser ni les bras se plier — bras tendus, scapulas verrouillées vers le bas. Mieux vaut une progression plus facile tenue parfaitement qu'une position avancée affaissée.", "alt": {"label": "Alternative", "text": "Tuck front lever raises : depuis la suspension, monte le corps en position tuck horizontale puis redescends, en contrôle. Construit la force du dorsal en dynamique. Ou ice cream makers / rows inversés lestés si la barre haute n'est pas dispo. 4×6–8."}, "stats": {"Séries": "4", "Durée": "5–15 sec", "Charge": "Poids de corps", "Repos": "90 sec"}}], "supersets": []}, {"chip": "Bloc 04", "name": "Jambes & Gainage", "sub": "Unilatéral + Compression abdominale", "duration": "~10 min · repos 60 sec", "icon": "🦵", "exercises": [{"name": "Pistol Squats", "sub": "Poids de corps · Unilatéral · Quadriceps + Équili
