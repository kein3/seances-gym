<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="triade-build" content="d5cbeea75260">
<title>TRIADE — Programme full body</title>
<meta name="description" content="TRIADE — trois séances full body en salle, avec minuteur de repos, suivi des charges et Tabata. Fonctionne hors ligne.">
<meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRIADE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* ═══════════════════════════════════════════════════════════
   TRIADE — feuille de style · direction « Calme »
   Le registre d'un beau carnet : beaucoup de blanc, aucune bordure
   inutile, un seul accent cuivre, des titres larges et légers.
   La hiérarchie vient de l'échelle et du blanc, jamais du cadre.
   ═══════════════════════════════════════════════════════════ */

:root {
  --bg: #fdfcfa;
  --surface: #ffffff;
  --surface-2: #f7f5f1;
  --surface-3: #f0ede7;
  --text: #1f1d1b;
  --text-2: #5f5a53;
  --muted: #6e675d;
  --line: #eeeae3;
  --line-strong: #d6cfc4;
  /* Cuivre repris d'un cran : sur le fond teinté d'un poste, l'ancien
     #a85f22 tombait à 4,23 de contraste — sous le seuil lisible. */
  --cuivre: #9d5820;
  --cuivre-clair: #b4682b;
  --ok: #1f1d1b;
  --warn: #b4682b;
  --danger: #a3342a;
  --a: #b4682b;
  --shadow-s: 0 1px 2px rgba(31, 29, 27, .04);
  --shadow-m: 0 4px 14px rgba(31, 29, 27, .07);
  --shadow-l: 0 10px 34px rgba(31, 29, 27, .14);
  --r-xl: 18px;
  --r-l: 14px;
  --r-m: 12px;
  --r-s: 9px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  /* Le poste est un CREUX, l'exercice une carte posée dedans. Même logique
     dans les deux thèmes : le creux s'éloigne du fond, la carte s'en approche. */
  --poste: #f2efe8;
  --poste-line: #e7e2d9;
  color-scheme: light;
}

html[data-theme="dark"] {
  --bg: #131211;
  --surface: #1a1917;
  --surface-2: #201e1b;
  --surface-3: #292620;
  --text: #f4f1ea;
  --text-2: #c8c2b7;
  --muted: #a49d92;
  --line: #262320;
  --line-strong: #3a352e;
  --cuivre: #d99155;
  --cuivre-clair: #e09c62;
  --ok: #f4f1ea;
  --warn: #e09c62;
  --danger: #e88b80;
  --shadow-s: 0 1px 2px rgba(0, 0, 0, .5);
  --shadow-m: 0 4px 14px rgba(0, 0, 0, .4);
  --shadow-l: 0 12px 36px rgba(0, 0, 0, .55);
  --poste: #0d0c0b;
  --poste-line: #211f1c;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
  padding-bottom: calc(28px + var(--safe-b));
}

button, input, textarea, select { font: inherit; color: inherit; font-family: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--cuivre); outline-offset: 3px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.wrap { width: 100%; max-width: 600px; margin: 0 auto; padding: 0 18px; }

/* ─── Petites capitales : le seul motif décoratif du système ─── */
.cap {
  font-size: 11px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase;
}

/* ═══════════ ACCUEIL ═══════════ */
.top { padding: calc(26px + var(--safe-t)) 0 6px; }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }

.brand-name {
  margin: 0;
  font-size: 30px; font-weight: 600;
  letter-spacing: -.03em; line-height: 1.05;
}

.brand-sub { margin: 5px 0 0; font-size: 13.5px; color: var(--muted); }

.icon-btn {
  width: 44px; height: 44px;
  flex: 0 0 44px;
  display: grid; place-items: center;
  border-radius: var(--r-m);
  color: var(--text-2);
  transition: background .15s ease;
}

@media (hover: hover) { .icon-btn:hover { background: var(--surface-3); } }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn-row { display: flex; gap: 4px; }

.week {
  margin: 22px 0 6px;
  padding: 13px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px;
}

.week-label {
  font-size: 11px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
}

.week-count { font-size: 15px; color: var(--text); font-weight: 600; letter-spacing: -.01em; }
.week-dots { display: flex; gap: 6px; margin-left: auto; }
.week-dot { width: 22px; height: 6px; border-radius: 99px; background: var(--surface-3); transition: background .2s ease; }
.week-dot.on { background: var(--dotcolor, var(--cuivre)); }

/* ─── Séances : des lignes, pas des cartes ─── */
.deck { display: block; }

.card {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 20px 2px;
  border-bottom: 1px solid var(--line);
  transition: opacity .15s ease;
}

.card:active { opacity: .6; }

.card-code {
  flex: 0 0 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 99px;
  margin-top: 2px;
  font-size: 14px; font-weight: 700;
  color: color-mix(in srgb, var(--a) 80%, #000);
  border: 1.5px solid color-mix(in srgb, var(--a) 45%, transparent);
}

.card-body { display: block; min-width: 0; flex: 1; }

.card-title {
  display: block;
  font-size: 21px; font-weight: 600;
  letter-spacing: -.025em; line-height: 1.15;
}

.card-sub { display: block; margin-top: 4px; font-size: 13px; color: var(--text-2); line-height: 1.4; }
.card-meta { display: block; margin-top: 7px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-prog { display: flex !important; align-items: center; gap: 10px; margin-top: 11px; }
.bar { display: block; flex: 1; height: 3px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--a); width: 0; transition: width .35s cubic-bezier(.2, .8, .3, 1); }

.card-prog-txt {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); white-space: nowrap;
}

.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
  margin: 30px 0 6px;
}

.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }

.tool {
  padding: 16px 2px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  transition: opacity .15s ease;
}

.tool:nth-child(odd) { padding-right: 12px; }
.tool:active { opacity: .6; }
.tool-ico { color: var(--cuivre); margin-bottom: 9px; height: 19px; }
.tool-ico svg { width: 18px; height: 18px; }
.tool-name { font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
.tool-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.foot { margin: 28px 0 8px; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.7; }

/* ═══════════ EN-TÊTE DE SÉANCE ═══════════ */
.s-head {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg);
  padding-top: var(--safe-t);
}

.s-head-in { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }

.back {
  width: 42px; height: 42px;
  flex: 0 0 42px;
  margin-left: -9px;
  border-radius: var(--r-m);
  display: grid; place-items: center;
  color: var(--text-2);
  transition: background .15s ease;
}

@media (hover: hover) { .back:hover { background: var(--surface-3); } }
.back svg { width: 21px; height: 21px; }
.s-head-txt { min-width: 0; flex: 1; }

.s-head-sub {
  font-size: 11px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--a) 78%, #000);
}

html[data-theme="dark"] .s-head-sub { color: color-mix(in srgb, var(--a) 52%, #fff); }
html[data-theme="dark"] .card-code { color: color-mix(in srgb, var(--a) 55%, #fff); }

.s-head-title {
  margin: 2px 0 0;
  font-size: 25px; font-weight: 600;
  letter-spacing: -.03em; line-height: 1.05;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.s-head-btn {
  height: 44px; padding: 0 10px;
  border-radius: var(--r-m);
  color: var(--cuivre);
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
  font-variant-numeric: tabular-nums;
}

.s-head-btn svg { width: 17px; height: 17px; }
.s-prog { height: 2px; background: var(--line); }
.s-prog-fill { display: block; height: 100%; width: 0; background: var(--a); transition: width .35s cubic-bezier(.2, .8, .3, 1); }

/* ─── Postes ─── */
.blocnav {
  position: sticky;
  top: var(--head-h, 86px);
  z-index: 35;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.blocnav-in {
  display: flex; gap: 20px;
  overflow-x: auto; scrollbar-width: none;
  padding: 0 18px;
  scroll-behavior: smooth;
}

.blocnav-in::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  min-height: 46px;
  padding: 0 0 3px;
  border-bottom: 1.5px solid transparent;
  color: var(--muted);
  font-size: 13.5px; font-weight: 500;
  white-space: nowrap;
  transition: color .16s ease, border-color .16s ease;
}

.tab.on { color: var(--text); border-bottom-color: var(--cuivre); font-weight: 700; }

.s-intro {
  margin: 22px 0 0;
  font-size: 15px; color: var(--text-2);
  line-height: 1.6;
}

/* ═══════════ BLOC — un poste de salle ═══════════ */
/* Le poste déborde de 8 px la gouttière de page : sans cela, le creux et la
   carte cumulaient leurs marges et le texte perdait 48 px de largeur utile. */
.bloc {
  margin: 26px -8px 0;
  padding: 16px 10px 14px;
  background: var(--poste);
  border: 1px solid var(--poste-line);
  border-radius: var(--r-xl);
  scroll-margin-top: calc(var(--head-h, 86px) + 58px);
}

.bloc-head { display: flex; align-items: baseline; gap: 9px; padding: 0 5px; }

.bloc-n {
  font-size: 12px; font-weight: 700; letter-spacing: .1em;
  color: var(--cuivre);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

.bloc-name {
  font-size: 12px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--text);
}

.bloc-dur {
  margin-left: auto;
  font-size: 11.5px; color: var(--muted);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}

.bloc-sub { font-size: 12.5px; color: var(--muted); margin-top: 5px; padding: 0 5px; }
.bloc-corps { display: flex; flex-direction: column; gap: 8px; margin-top: 13px; }

/* ═══════════ EXERCICE ═══════════ */
.exo {
  padding: 18px 14px 15px;
  background: var(--surface);
  border-radius: var(--r-l);
  box-shadow: var(--shadow-s);
}
.exo-tete { display: flex; align-items: flex-start; gap: 10px; }
.exo-txt { min-width: 0; flex: 1; }

.exo-name {
  font-size: 20px; font-weight: 600;
  letter-spacing: -.028em; line-height: 1.15;
  display: flex; align-items: baseline; gap: 8px;
}

.exo-fait { color: var(--cuivre); font-size: 13px; font-weight: 700; }
.exo.done .exo-name { color: var(--muted); }
.exo-sub { margin-top: 5px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.exo-meta { margin-top: 6px; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.repos {
  flex: 0 0 auto;
  height: 44px; padding: 0 8px;
  color: var(--cuivre);
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 5px;
  font-variant-numeric: tabular-nums;
  border-radius: var(--r-s);
  transition: background .15s ease;
}

@media (hover: hover) { .repos:hover { background: var(--surface-3); } }
.repos svg { width: 15px; height: 15px; }

/* ─── Rangées d'action ─── */
.rang { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

.pt {
  width: 48px; height: 48px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-m);
  color: var(--muted);
  font-size: 14.5px; font-weight: 600;
  display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
  transition: transform .12s cubic-bezier(.2, .8, .3, 1), background .16s ease, border-color .16s ease, color .16s ease;
}

.pt:active { transform: scale(.92); }
.pt.on { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.pt.on svg { width: 18px; height: 18px; }
.pt.ronde { border-radius: 99px; }

.effacer { margin-left: auto; min-height: 44px; padding: 0 4px; color: var(--muted); font-size: 12px; }

.charge { gap: 9px; }

.pas {
  width: 48px; height: 48px;
  flex: 0 0 48px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-m);
  color: var(--text-2);
  font-size: 21px; font-weight: 400; line-height: 1;
  display: grid; place-items: center;
  transition: transform .1s ease, border-color .15s ease;
}

.pas:active { transform: scale(.92); border-color: var(--cuivre); }

.poids-box {
  flex: 1; min-width: 60px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  height: 48px;
}

.poids {
  width: auto; max-width: 74%;
  height: 46px;
  border: 0; background: none; padding: 0;
  font-size: 25px; font-weight: 600;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.poids:focus { outline: none; box-shadow: 0 2px 0 var(--cuivre); }
.poids::placeholder { color: var(--line-strong); font-weight: 400; }
.poids-unit { font-size: 12px; font-weight: 600; color: var(--muted); }

.sugg {
  flex: 0 0 auto;
  display: inline-flex; align-items: center;
  height: 48px; padding: 0 14px;
  border-radius: 99px;
  border: 1px solid color-mix(in srgb, var(--cuivre) 30%, transparent);
  color: var(--cuivre);
  font-size: 13px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.dernier { margin-top: 11px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dernier b { color: var(--text-2); font-weight: 700; }

/* ─── Superset : un filet cuivre qui tient les cartes ensemble ─── */
.ss {
  display: flex; flex-direction: column; gap: 8px;
  padding-left: 11px;
  border-left: 2px solid var(--cuivre);
}

.ss-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 2px 4px 2px 0;
  min-width: 0;
}

.ss-badge {
  font-size: 11px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--cuivre);
}

.ss-note { flex: 1 1 100%; min-width: 0; font-size: 12.5px; color: var(--muted); }
.ss-rounds { display: flex; align-items: center; gap: 8px; margin-top: 2px; padding-left: 2px; flex-wrap: wrap; }

.ss-rounds-lab {
  font-size: 11px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--muted);
}

/* ─── Détails ─── */
.det { margin-top: 8px; }

.det-btn {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  min-height: 44px;
  color: var(--muted);
  font-size: 12.5px;
}

.det-btn svg { width: 15px; height: 15px; transition: transform .2s ease; margin-left: auto; }
.det.open .det-btn svg { transform: rotate(180deg); }
.det-body { display: none; padding: 6px 0 14px; }
.det.open .det-body { display: block; }

.note-block { margin-bottom: 16px; }

/* ─── Schéma du mouvement ─── */
.fig-zone {
  background: var(--poste);
  border-radius: var(--r-m);
  padding: 6px 8px 8px;
}

.fig { width: 100%; height: auto; display: block; max-width: 300px; margin: 0 auto; }
.fig-a, .fig-mat, .fig-sol, .fig-cable, .fig-fleche {
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}

/* La pose de départ reste un fil de fer ; la pose finale est un corps :
   son contour d'abord, sa chair par-dessus — c'est ce qui efface les
   jointures intérieures — puis le muscle travaillé en cuivre. */
.fig-a { stroke: var(--text); stroke-width: 1.8; opacity: .3; }
.fig-a.fig-fond { opacity: .18; }
.fig-trait { fill: var(--text); stroke: var(--text); stroke-width: 3; stroke-linejoin: round; }
.fig-chair { fill: var(--poste); stroke: none; }
.fig-mus { fill: var(--cuivre); stroke: none; }
.fig-mus-2 { fill: var(--cuivre); stroke: none; opacity: .34; }
.fig-mat { stroke: var(--muted); stroke-width: 1.9; }
.fig-sol { stroke: var(--muted); stroke-width: 1.4; opacity: .45; }
.fig-cable { stroke: var(--muted); stroke-width: 1.2; opacity: .8; }
.fig-fleche { stroke: var(--cuivre); stroke-width: 2.2; }

.fig-leg {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted);
}

.fig-leg span { width: 15px; height: 2px; background: var(--text); border-radius: 2px; }
.fig-leg-a { opacity: .3; }
.fig-leg-b { margin-left: 8px; }

.fig-mus-txt {
  margin-top: 7px; padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted); line-height: 1.45; text-align: center;
}

.fig-mus-txt b { color: var(--cuivre); font-weight: 700; }

.note-k {
  font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 6px;
}

.note-k .kdot { display: none; }
.note-t { font-size: 14px; color: var(--text-2); line-height: 1.62; }
/* Deux repères de geste, deux filets : le bon en encre, le mauvais en cuivre. */
.note-t.ok { color: var(--text-2); border-left: 1px solid var(--ok); padding-left: 12px; }
.note-t.warn { color: var(--text-2); border-left: 1px solid var(--cuivre); padding-left: 12px; }
.note-t.alt { color: var(--muted); }

.load-hist { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.load-hist::-webkit-scrollbar { display: none; }

.hchip {
  flex: 0 0 auto;
  min-height: 44px;
  font-size: 13px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  text-align: left;
}

.hchip b { font-weight: 700; display: block; }
.hchip span { color: var(--muted); font-size: 11px; }

.myn {
  width: 100%; min-height: 66px;
  resize: vertical;
  border: 0;
  border-bottom: 1px solid var(--line-strong);
  background: none;
  padding: 8px 0;
  font-size: 14px; line-height: 1.55;
}

.myn:focus { border-color: var(--cuivre); outline: none; }

/* ═══════════ ÉCRAN PLEIN ═══════════ */
.veil {
  position: fixed; inset: 0; z-index: 200;
  display: none; place-items: center;
  background: color-mix(in srgb, var(--bg) 96%, #000);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 24px;
  animation: fade .18s ease;
}

.veil.on { display: grid; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.veil-in { width: 100%; max-width: 340px; text-align: center; }

/* ─── Le minuteur : un chiffre, un filet qui se vide, des liens ─── */
.chrono-ctx {
  color: var(--cuivre);
  min-height: 16px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chrono-ctx.sourd { color: var(--muted); margin-top: 20px; }

.chrono-time {
  margin: 14px 0 0;
  font-size: 78px; font-weight: 600;
  letter-spacing: -.055em; line-height: .95;
  font-variant-numeric: tabular-nums;
}

.chrono-jauge {
  height: 2px;
  background: var(--line);
  margin: 26px 0 0;
  overflow: hidden;
}

.chrono-jauge i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--cuivre);
  transition: width .3s linear;
}

.chrono-actes {
  display: flex;
  justify-content: center;
  gap: 26px;
  margin-top: 6px;
}

.chrono-bas {
  display: flex;
  justify-content: center;
  gap: 26px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.lien {
  min-height: 46px;
  padding: 0 6px;
  color: var(--text-2);
  font-size: 15px; font-weight: 500;
  font-variant-numeric: tabular-nums;
  border-radius: var(--r-s);
  transition: color .15s ease;
}

.lien.fort { color: var(--cuivre); font-weight: 700; }
@media (hover: hover) { .lien:hover { color: var(--text); } }

.veil-title { font-size: 13.5px; font-weight: 600; color: var(--text-2); margin-bottom: 22px; min-height: 20px; }
.veil-btns { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }

.btn {
  height: 48px; padding: 0 20px;
  border-radius: var(--r-m);
  border: 1px solid var(--line-strong);
  font-size: 14.5px; font-weight: 600;
  color: var(--text);
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform .12s ease, background .15s ease;
}

.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }

/* Une seule surface pleine dans tout le système : l'action principale. */
.btn-primary { background: var(--text); border-color: transparent; color: var(--bg); font-weight: 600; }
.btn-wide { width: 100%; justify-content: center; }
.btn-ghost { border-color: var(--line); color: var(--text-2); }
.btn-danger { color: #fff; background: #9c3128; border-color: transparent; }

/* ─── Durées courantes : une liste, pas huit pavés ─── */
.durees { display: grid; grid-template-columns: repeat(4, 1fr); }

.duree {
  min-height: 52px;
  color: var(--text);
  font-size: 15px; font-weight: 500;
  border-bottom: 1px solid var(--line);
  transition: color .15s ease;
}

.duree:nth-child(-n+4) { border-top: 1px solid var(--line); }
@media (hover: hover) { .duree:hover { color: var(--cuivre); } }

.phase-work { --cuivre: #a3342a; }
.phase-rest { --cuivre: #3d6b7d; }
.phase-prep { --cuivre: #a85f22; }

/* ═══════════ PASTILLE DE REPOS ═══════════ */
.mini {
  position: fixed;
  left: 50%; bottom: calc(18px + var(--safe-b));
  transform: translateX(-50%);
  z-index: 190;
  display: none; align-items: center; gap: 5px;
  background: var(--text);
  border-radius: 99px;
  box-shadow: var(--shadow-l);
  padding: 5px 5px 5px 16px;
  overflow: hidden;
}

.mini.on { display: flex; }
/* Une seule ligne de texte : le temps et le libellé partagent la même ligne de
   base sans arbitrage, et line-height centre le tout dans la pastille. */
.mini-in { display: block; height: 44px; line-height: 44px; padding: 0 8px 0 0; white-space: nowrap; }
.mini-time {
  font-size: 20px; font-weight: 600;
  letter-spacing: -.03em;
  color: var(--bg);
  font-variant-numeric: tabular-nums;
}

.mini-lab {
  margin-left: 9px;
  font-size: 10px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--bg) 62%, transparent);
}

.mini-plus {
  height: 44px; padding: 0 10px;
  line-height: 44px;
  font-size: 13px; font-weight: 600;
  color: color-mix(in srgb, var(--bg) 72%, transparent);
  font-variant-numeric: tabular-nums;
}

.mini-stop {
  width: 44px; height: 44px;
  flex: 0 0 44px;
  border-radius: 99px;
  background: var(--cuivre); color: #fff;
  display: grid; place-items: center;
}

html[data-theme="dark"] .mini-stop { color: #17130f; }
.mini-stop svg { width: 19px; height: 19px; }
.mini-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--cuivre); transition: width .3s linear; }

@keyframes pulseFini {
  0%, 100% { box-shadow: var(--shadow-l), 0 0 0 0 color-mix(in srgb, var(--cuivre) 50%, transparent); }
  50%      { box-shadow: var(--shadow-l), 0 0 0 13px color-mix(in srgb, var(--cuivre) 0%, transparent); }
}

.mini.fini { animation: pulseFini 1.1s ease-out 3; }
.mini.fini .mini-time { color: var(--cuivre-clair); font-size: 17px; letter-spacing: -.01em; }

body.timer-on { padding-bottom: calc(96px + var(--safe-b)); }

/* ═══════════ FEUILLE MODALE ═══════════ */
.sheet {
  position: fixed; inset: 0; z-index: 210;
  display: none; align-items: flex-end; justify-content: center;
  background: rgba(31, 29, 27, .38);
  animation: fade .16s ease;
}

.sheet.on { display: flex; }

.sheet-in {
  width: 100%; max-width: 600px;
  background: var(--bg);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: 8px 22px calc(24px + var(--safe-b));
  box-shadow: var(--shadow-l);
  max-height: 88vh; overflow-y: auto;
  animation: rise .26s cubic-bezier(.2, .9, .3, 1);
}

@keyframes rise { from { transform: translateY(22px); opacity: .6 } to { transform: none; opacity: 1 } }

.grip { width: 36px; height: 4px; border-radius: 99px; background: var(--line-strong); margin: 6px auto 18px; }
.sheet-title { font-size: 23px; font-weight: 600; letter-spacing: -.03em; margin: 0 0 6px; }
.sheet-sub { font-size: 13.5px; color: var(--muted); margin: 0 0 22px; line-height: 1.55; }

.field { margin-bottom: 18px; }

.field-lab {
  font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted);
  display: block; margin-bottom: 8px;
}

.stepper { display: flex; align-items: center; gap: 12px; padding: 0; }

.step-btn {
  width: 46px; height: 46px;
  flex: 0 0 46px;
  border-radius: var(--r-m);
  border: 1px solid var(--line-strong);
  font-size: 21px; font-weight: 400; line-height: 1;
  display: grid; place-items: center;
  color: var(--text-2);
}

.step-btn:active { transform: scale(.94); }
.step-val { flex: 1; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.step-val small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }

.load-in {
  width: 100%; height: 48px;
  border: 0; border-bottom: 1px solid var(--line-strong); background: none;
  font-size: 26px; font-weight: 600;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.load-in:focus { outline: none; border-color: var(--cuivre); }

.row-list { display: grid; gap: 0; margin-bottom: 6px; }

.row-btn {
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  transition: opacity .15s ease;
}

.row-btn:active { opacity: .6; }
.row-btn svg { width: 19px; height: 19px; color: var(--cuivre); flex: 0 0 19px; }
.row-btn-txt { min-width: 0; flex: 1; }
.row-btn-name { font-size: 15.5px; font-weight: 600; letter-spacing: -.015em; }
.row-btn-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.row-btn.danger .row-btn-name, .row-btn.danger svg { color: var(--danger); }

.seg { display: flex; gap: 22px; padding: 2px 0; }

.seg button {
  min-height: 46px;
  min-width: 52px;
  border-bottom: 1.5px solid transparent;
  font-size: 14.5px; font-weight: 500;
  color: var(--muted);
  transition: color .16s ease, border-color .16s ease;
}

.seg button.on { color: var(--text); border-bottom-color: var(--cuivre); font-weight: 700; }

.toast {
  position: fixed;
  left: 50%; bottom: calc(80px + var(--safe-b));
  transform: translate(-50%, 14px);
  z-index: 300;
  background: var(--text); color: var(--bg);
  font-size: 13.5px; font-weight: 600;
  padding: 12px 20px;
  border-radius: 99px;
  box-shadow: var(--shadow-l);
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .24s cubic-bezier(.2, .9, .3, 1);
  max-width: calc(100vw - 40px);
  text-align: center;
}

.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 720px) {
  .wrap { max-width: 660px; }
  .brand-name { font-size: 34px; }
  .tools { grid-template-columns: repeat(4, 1fr); }
  .tool:nth-child(odd) { padding-right: 12px; }
  .sheet-in { border-radius: var(--r-xl); margin-bottom: 5vh; }
  .sheet { align-items: center; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

on, et tu sens l'étirement des pectoraux en bas sans rien de désagréable à l'avant de l'épaule."},{"id":"a-rowing-hal","name":"Rowing haltère un bras","sub":"Haltère · Appui sur le même banc · Milieu du dos + Dorsaux","sets":4,"reps":"8 / bras","tempo":"2-1-2","trackLoad":true,"step":2,"loadHint":"28–40 kg","execution":"Un genou et une main sur le banc que tu viens d'utiliser, dos à plat. Tire l'haltère vers la hanche en amenant le coude le long du corps, serre l'omoplate une seconde en haut, laisse redescendre bras complètement tendu pour étirer le dos. Toutes les répétitions d'un bras, puis l'autre.","avoid":"Tourner le buste pour arracher les dernières répétitions : le tronc reste immobile.","alt":"Rowing barre buste penché, 4 × 8 (au rack), ou rowing machine poitrine appuyée.","setup":"Le même banc. Genou et main du même côté posés dessus, l'autre pied au sol légèrement en arrière. Le dos doit arriver à l'horizontale et rester plat — si tu n'y arrives pas, avance le pied au sol. L'haltère est au sol dans l'axe de l'épaule, tu le prends bras tendu.","reussi":"Le buste est exactement dans la même position à la dernière répétition qu'à la première, et ça tire sous l'aisselle et entre les omoplates."}]},{"type":"ex","id":"a-roue","name":"Roue abdominale","sub":"Genoux au sol · Gainage antérieur · Anti-extension","sets":3,"reps":"10–12","tempo":"3-0-2","rest":60,"execution":"À genoux, hanches légèrement en avant, bas du dos volontairement arrondi (le contraire de ce qu'on croit). Déroule aussi loin que tu peux SANS que le bas du dos se creuse, puis reviens en tirant avec les abdos. Arrête-toi à la distance que tu maîtrises.","avoid":"Aller trop loin : dès que le bassin bascule et que les lombaires se creusent, tu travailles le dos et plus les abdos.","alt":"Planche sur les coudes 3 × 45 sec, ou relevés de jambes suspendus 3 × 12.","setup":"À genoux sur un tapis ou une serviette pliée, la roue posée devant toi juste sous les épaules, une main sur chaque poignée. Rentre le bassin sous toi pour arrondir légèrement le bas du dos AVANT de commencer à dérouler : cette position de départ est l'exercice.","reussi":"Tu pourrais t'arrêter net à n'importe quel moment du déroulé sans que le bas du dos s'affaisse."}]},{"n":"04","name":"À la station de câbles","sub":"Trois exercices à la poulie · 3 tours","duration":"~14 min · repos 1'15","items":[{"type":"superset","id":"a-ss2","rounds":3,"rest":75,"label":"Triceps, épaules arrière, épaules de côté — si un poste est pris, fais-les l’un après l’autre","exercises":[{"id":"b-triceps-oh","name":"Extension triceps bras au-dessus de la tête","sub":"Poulie · Corde · Bras verticaux · Chef long en position étirée","sets":3,"reps":"12","tempo":"2-1-2","trackLoad":true,"step":2.5,"loadHint":"20–32 kg","execution":"Dos à la poulie, corde derrière la tête, coudes pointés vers l'avant et maintenus le plus haut possible. C'est cette position bras au-dessus de la tête qui met le chef long du triceps en étirement — et à l'étirement, il grossit nettement plus qu'en poussée devant soi. Tends complètement, marque 1 seconde, laisse revenir jusqu'à sentir l'étirement derrière le bras.","avoid":"Laisser les coudes s'écarter et redescendre le long du corps : on retombe sur un pushdown ordinaire et on perd tout l'intérêt de la position.","alt":"Extension nuque assis avec un haltère à deux mains, ou barre EZ couché derrière la tête : même principe, bras au-dessus de la tête.","setup":"Corde accrochée à la poulie BASSE. Prends-la à deux mains, tourne-toi dos à la poulie, fais un pas en avant et passe la corde derrière la tête. Un pied devant l'autre pour ne pas être tiré en arrière. Les coudes pointent vers l'avant et vers le haut, serrés vers l'intérieur.","reussi":"Les coudes restent au même endroit dans l'espace du début à la fin, et l'étirement se sent derrière le bras en position basse."},{"id":"a-facepull","name":"Face pull à la corde","sub":"Poulie à hauteur des yeux · Épaules arrière + Trapèzes moyens","sets":3,"reps":"15","tempo":"2-1-2","trackLoad":true,"step":2.5,"loadHint":"15–25 kg","execution":"Poulie réglée à hauteur des yeux, pouces vers toi. Tire la corde vers le visage en écartant les mains et en tournant les avant-bras vers l'arrière, comme un double biceps de bodybuilder. Marque 1 seconde. C'est le contrepoids de toutes tes poussées : ne le saute pas.","avoid":"Prendre lourd et tirer avec le buste — reste droit, charge légère.","alt":"Oiseau penché aux haltères légers, 3 × 15.","setup":"Corde à la poulie réglée à hauteur des yeux. Prise neutre, pouces vers toi. Recule jusqu'à ce que le câble soit déjà tendu bras tendus, un pied devant l'autre, buste droit.","reussi":"Les mains finissent de part et d'autre du visage à hauteur des oreilles, coudes plus hauts que les poignets."},{"id":"a-elev-lat","name":"Élévations latérales à la poulie","sub":"Poulie basse · Un bras · Deltoïdes médians · Tension constante","sets":3,"reps":"15","tempo":"1-1-3","trackLoad":true,"step":2.5,"loadHint":"7–12 kg par côté","execution":"Poulie en position basse, poignée prise de la main opposée, câble qui passe devant les jambes. Monte le bras sur le côté jusqu'à hauteur d'épaule, descends en 3 secondes. L'avantage du câble : la tension existe déjà en bas du mouvement, là où les haltères ne pèsent presque rien.","avoid":"Se pencher du côté opposé pour aider : le buste reste droit, quitte à baisser la charge.","alt":"Élévations latérales aux haltères, 4 × 15 — mais elles te font quitter la station de câbles.","setup":"Poulie en position la plus basse, poignée simple. Place-toi la poulie sur ta droite et prends la poignée de la main GAUCHE : le câble passe devant tes cuisses. Attrape la colonne de l'autre main pour t'empêcher de te pencher.","reussi":"Le bras monte franchement sur le côté et non devant toi, sans que l'épaule remonte vers l'oreille."}]}]}]},"charniere":{"code":"B","title":"Charnière","subtitle":"Le rack · Un banc inclinable · Les machines","focus":"Hanches & dos","duration":"~55 min","accent":"#9A7B2E","accent2":"#8C6F26","intro":"Le soulevé roumain au rack, seul mouvement lourd. Ensuite un banc inclinable gardé pour le développé et le curl — même banc, même inclinaison. Puis la zone machines pour les trois derniers exercices.","blocs":[{"n":"01","name":"Mise en route","sub":"Vélo ou rameur, puis charnière à vide","duration":"~7 min · repos 30 sec","items":[{"type":"ex","id":"b-cardio","name":"Vélo ou rameur","sub":"Cardio progressif","sets":1,"reps":"3 min","tempo":"progressif","rest":0,"execution":"Même principe que la séance Socle : monte doucement en intensité, tu dois avoir chaud sans être fatigué. Le rameur est un bon choix ici parce qu'il réveille déjà la charnière de hanche — à chaque coup, les fesses partent en arrière et les ischios s'étirent, exactement le mouvement du soulevé roumain qui arrive.","avoid":"Partir trop fort.","alt":"Marche en pente 5 min.","setup":"Même mise en place que la séance Socle. Le rameur est le meilleur choix ici : cale les pieds, assieds-toi jambes fléchies et bras tendus vers la barre.","reussi":"Tu as chaud, la hanche se plie librement, et tu n'es pas essoufflé."},{"type":"ex","id":"b-hinge","name":"Charnière de hanche à vide","sub":"Barre à vide ou bâton · Apprentissage du mouvement","sets":2,"reps":"12","tempo":"3-0-1","rest":30,"execution":"Barre à vide sur les trapèzes ou bâton dans le dos. Genoux très légèrement fléchis et FIXES, pousse les fesses vers l'arrière en gardant le dos parfaitement droit, jusqu'à sentir les ischios s'étirer. Remonte en serrant les fessiers. C'est la répétition à blanc du soulevé roumain qui arrive.","avoid":"Confondre avec un squat : ici les genoux ne bougent presque pas.","alt":"Good morning à la barre à vide, 2 × 12.","setup":"Une barre à vide sur les trapèzes, ou un bâton tenu contre le dos en trois points de contact : l'arrière du crâne, le haut du dos, le sacrum. Pieds largeur de bassin, genoux à peine déverrouillés.","reussi":"Les trois points de contact du bâton ne se décollent jamais, et l'étirement se sent à l'arrière des cuisses en position basse."}]},{"n":"02","name":"Au rack — la barre","sub":"Le seul mouvement lourd de la séance","duration":"~14 min · repos 2'30","items":[{"type":"ex","id":"b-rdl","name":"Soulevé de terre roumain","sub":"Barre libre · Ischio-jambiers + Fessiers + Dos","sets":4,"reps":"6","tempo":"3-1-1","rest":150,"trackLoad":true,"step":2.5,"loadHint":"70–100 kg","execution":"Départ debout, barre contre les cuisses, prise en pronation largeur d'épaules. Genoux à peine fléchis et fixes. Descends la barre le long des jambes en poussant les fesses loin derrière, dos droit et barre en contact avec la peau. Arrête-toi quand les ischios sont au maximum de l'étirement — en général juste sous le genou — puis remonte en serrant les fessiers. Avant la première série lourde, monte en trois séries d'échauffement : barre à vide, puis environ 50 % et 75 % de ta charge du jour, 5 répétitions chacune. C'est le meilleur échauffement possible pour ce mouvement — plus utile que n'importe quel étirement.","avoid":"Descendre plus bas que ce que la souplesse permet : c'est là que le dos s'arrondit. La barre ne doit jamais s'éloigner des jambes.","alt":"Soulevé roumain aux haltères, 4 × 8, ou hyperextension lestée si le bas du dos est sensible.","setup":"Pose la barre sur les crochets du rack à hauteur de mi-cuisse : tu la prends debout, tu ne la ramasses pas au sol — c'est ce qui économise le dos avant les séries lourdes. Prise en pronation largeur d'épaules, un pas en arrière, pieds largeur de bassin.","reussi":"La barre frotte les cuisses pendant toute la descente, et ce sont les ischios qui t'arrêtent — pas le bas du dos."}]},{"n":"03","name":"Un banc inclinable et des haltères","sub":"Le même banc pour les deux · 5 tours","duration":"~14 min · repos 1'15","items":[{"type":"superset","id":"b-ss1","rounds":5,"rest":75,"label":"Développé incliné puis curl incliné — même banc, même inclinaison","exercises":[{"id":"b-incline","name":"Développé incliné haltères","sub":"Haltères · Banc à 30° · Pectoraux hauts","sets":5,"reps":"8–10","tempo":"3-0-1","trackLoad":true,"step":2,"loadHint":"22–32 kg par haltère","execution":"Banc réglé à 30° maximum — au-delà ce sont les épaules qui prennent tout. Descends les haltères en 3 secondes jusqu'à ce que les coudes soient légèrement sous la ligne du torse, puis pousse en rapprochant les haltères sans les cogner. L'inclinaison a sa raison d'être : c'est elle qui développe le haut des pectoraux, que le développé couché à plat de la séance A ne va pas chercher.","avoid":"Un banc trop redressé, et une descente non contrôlée.","alt":"Dips pectoraux buste penché, 4 × 8–10 (lestés si tu dépasses 12) : excellente alternative, un peu moins ciblée sur le haut des pectoraux. Ou développé incliné à la barre.","setup":"Banc réglé à 30°, soit le premier ou le deuxième cran depuis l'horizontale sur la plupart des bancs — pas au-delà. Assieds-toi haltères debout sur les cuisses, puis bascule en arrière en les poussant avec les genoux. Pieds à plat, omoplates serrées.","reussi":"Ça travaille sur le haut des pectoraux, juste sous la clavicule, et pas à l'avant de l'épaule."},{"id":"b-curl-incline","name":"Curl incliné haltères","sub":"Haltères · Banc à 45–60° · Biceps en position étirée","sets":5,"reps":"10","tempo":"3-1-1","trackLoad":true,"step":2,"loadHint":"10–16 kg","execution":"Assis sur un banc incliné, laisse les bras pendre derrière la ligne du corps. Cette position, épaule en extension, étire le biceps sur sa partie haute — c'est là qu'il répond le mieux. Monte sans avancer le coude, marque 1 seconde en haut, descends en 3 secondes jusqu'aux bras complètement tendus. La charge sera plus légère qu'un curl debout : c'est normal et ce n'est pas un recul.","avoid":"Ramener les coudes vers l'avant pendant la montée : l'étirement disparaît, et avec lui la raison de faire cet exercice.","alt":"Curl à la poulie basse en se plaçant un pas devant la poulie, bras en arrière ; ou curl marteau debout si les bancs inclinés sont pris — prise neutre pour le brachial, moins d'étirement.","setup":"Le même banc, redressé à 45–60°. Assieds-toi dos entièrement plaqué au dossier et laisse les bras pendre librement derrière la ligne du corps, haltères en supination, paumes vers l'avant. Les épaules restent en arrière, contre le dossier.","reussi":"Au départ de chaque répétition les bras pendent en arrière de la ligne du corps, et le coude ne s'avance pas d'un centimètre pendant la montée."}]}]},{"n":"04","name":"Aux machines","sub":"Épaules, dos, mollets · 4 tours","duration":"~17 min · repos 1'30","items":[{"type":"superset","id":"b-ss2","rounds":4,"rest":90,"label":"Trois machines de la même zone — si l’une est prise, fais-les l’une après l’autre","exercises":[{"id":"b-epaules-machine","name":"Développé épaules machine","sub":"Machine · Assis dossier vertical · Épaules avant et médianes","sets":4,"reps":"10","tempo":"2-0-2","trackLoad":true,"step":5,"loadHint":"35–55 kg","execution":"Règle le siège pour que les poignées arrivent au niveau des oreilles, dos plaqué au dossier. Pousse jusqu'à bras presque tendus sans verrouiller, redescends en contrôlant jusqu'aux oreilles. La machine est ici pour une raison pratique : elle est dans la même zone que les mollets, et à volume égal elle fait grossir autant que la barre.","avoid":"Descendre plus bas que les oreilles en cherchant l'amplitude : l'épaule n'aime pas, et le gain est nul.","alt":"Développé militaire à la barre debout, 4 × 6 (le mouvement de référence, mais il te renvoie au rack) : Barre sur le haut des pectoraux, prise juste plus large que les épaules, coudes légèrement en avant. Serre les fessiers et le ventre pour verrouiller …","setup":"Règle la hauteur du siège pour que les poignées arrivent au niveau des oreilles, pas plus haut. Dos et bas du dos plaqués au dossier, pieds à plat au sol.","reussi":"Le dos reste collé au dossier même sur la dernière répétition, et les coudes ne descendent pas sous les oreilles."},{"id":"c-rowing-machine","name":"Rowing machine poitrine appuyée","sub":"Machine · Buste calé · Milieu du dos et trapèzes","sets":4,"reps":"10","tempo":"2-1-2","trackLoad":true,"step":5,"loadHint":"40–60 kg","execution":"Poitrine calée contre le support, ce qui supprime toute triche du buste et tout travail du bas du dos — c'est l'intérêt de la machine ici, en fin de semaine. Tire les coudes vers l'arrière le long du corps, serre les omoplates une seconde, reviens en laissant les bras s'étendre complètement pour étirer le dos.","avoid":"Tirer avec les bras seuls : le mouvement commence par les omoplates qui se rapprochent.","alt":"Rowing barre buste penché, 4 × 8, si tu préfères la barre : Buste incliné à environ 70°, dos droit, barre pendue bras tendus. Tire la barre vers le bas des abdominaux en …","setup":"Règle la hauteur du siège pour que les poignées arrivent au niveau du bas des pectoraux, puis la butée de poitrine pour que le sternum soit calé sans être écrasé. Pieds sur les cales, poitrine en appui avant de saisir les poignées.","reussi":"La poitrine ne décolle pas du support, et le mouvement commence par les omoplates qui se rapprochent avant que les bras plient."},{"id":"b-mollets","name":"Mollets debout","sub":"Machine ou barre · Amplitude complète","sets":4,"reps":"18","tempo":"2-1-2","trackLoad":true,"step":5,"loadHint":"60–100 kg","execution":"Avant-pieds sur la plateforme. Laisse les talons descendre le plus bas possible pour étirer complètement, puis monte sur la pointe des pieds et tiens 1 seconde en haut. L'amplitude complète compte plus que la charge. Debout genou tendu, et non assis : c'est cette position qui étire le mollet et le fait grossir, la version assise n'apporte presque rien de plus sur le soléaire.","avoid":"Les demi-répétitions rapides en rebond.","alt":"Mollets à la presse à cuisses, 3 × 20.","setup":"Avant-pieds sur le bord de la plateforme, talons dans le vide. Règle les épaulières pour être en appui debout jambes tendues sans avoir à te tasser pour t'y glisser.","reussi":"En bas le talon descend nettement sous le niveau de l'avant-pied, en haut tu tiens une seconde pleine sur la pointe."}]}]}]},"amplitude":{"code":"C","title":"Amplitude","subtitle":"Un banc · La barre de traction · Les câbles · Les machines","focus":"Volume","duration":"~58 min","accent":"#4F7A63","accent2":"#456B57","intro":"Aucune barre à charger. Un banc et des haltères, puis le dos à la barre de traction, puis la station de câbles pour les pectoraux et les biceps, et les machines pour finir.","blocs":[{"n":"01","name":"Mise en route","sub":"Vélo, puis épaules à vide","duration":"~7 min · repos 30 sec","items":[{"type":"ex","id":"c-cardio","name":"Corde à sauter ou vélo","sub":"Cardio léger","sets":1,"reps":"3 min","tempo":"progressif","rest":0,"execution":"Reste léger : la séance monte en température toute seule avec les bulgares. Si tu prends la corde, alterne 40 secondes de saut et 20 secondes de pause.","avoid":"Rien à surveiller, reste léger.","alt":"Rameur 4 min.","setup":"Résistance faible. À la corde, garde-la courte : les poignées doivent arriver aux aisselles quand tu poses un pied au milieu.","reussi":"Tu as chaud, les épaules et les chevilles sont déliées, et tu n'as rien entamé."},{"type":"ex","id":"c-elev-warm","name":"Élévations latérales légères","sub":"Haltères très légers · Préparation de l'épaule","sets":2,"reps":"15","tempo":"lent","rest":30,"execution":"Monte les bras sur les côtés jusqu'à hauteur d'épaules, descends lentement en freinant. Le but est d'irriguer l'articulation et de réveiller les rotateurs avant les tractions et les élévations lourdes, pas de fatiguer l'épaule : si tu sens le muscle brûler, c'est trop lourd.","avoid":"Prendre les mêmes haltères qu'au bloc 04.","alt":"Rotations externes à l'élastique, 2 × 15 par bras.","setup":"Deux haltères de 3 à 5 kg au maximum. Debout, pieds largeur de bassin, bras le long du corps, coudes très légèrement fléchis et figés.","reussi":"L'épaule est chaude et le mouvement est libre — aucune sensation de fatigue."}]},{"n":"02","name":"Un banc et des haltères","sub":"Bulgares et élévations · 3 tours","duration":"~12 min · repos 1'45","items":[{"type":"superset","id":"c-ss1","rounds":3,"rest":105,"label":"Les deux jambes, puis les élévations pendant que les jambes récupèrent","exercises":[{"id":"c-bulgares","name":"Fentes bulgares haltères","sub":"Haltères · Pied arrière sur un banc · Une jambe à la fois","sets":3,"reps":"8 / jambe","tempo":"3-0-1","trackLoad":true,"step":2,"loadHint":"14–24 kg par haltère","execution":"Pied arrière posé sur un banc, pied avant assez loin devant pour que le genou reste au-dessus de la cheville en bas. Descends en 3 secondes jusqu'à ce que le genou arrière frôle le sol, buste légèrement penché en avant pour charger le fessier. Fais les 8 répétitions d'une jambe, puis l'autre sans repos.","avoid":"Un pied avant trop proche du banc : le genou passe devant les orteils et prend tout.","alt":"Fentes marchées haltères 4 × 10 par jambe, ou split squat statique si l'équilibre pose problème.","setup":"Banc dans le dos. Pose le dessus du pied arrière dessus, puis avance le pied avant jusqu'à ce qu'en descendant, le tibia avant reste vertical — repère cette distance une bonne fois. Prends les haltères ensuite, bras le long du corps.","reussi":"Le genou arrière descend à quelques centimètres du sol pendant que le genou avant reste au-dessus de la cheville."},{"id":"c-elev-lat","name":"Élévations latérales haltères","sub":"Haltères · Deltoïdes médians · La largeur d'épaules","sets":3,"reps":"15","tempo":"1-1-3","trackLoad":true,"step":2,"loadHint":"8–12 kg","execution":"Légère flexion des coudes, monte jusqu'à hauteur d'épaules comme si tu versais un verre d'eau (petit doigt un peu plus haut que le pouce), puis descends en 3 secondes. Charge légère et exécution stricte : ce muscle répond aux répétitions propres, pas au poids.","avoid":"Se pencher en arrière et monter d'un coup de reins.","alt":"Élévations à la poulie basse un bras si un poste est libre : tension constante même en bas.","setup":"Deux haltères, debout, pieds largeur de bassin, buste très légèrement penché en avant, coudes fléchis d'un rien et figés dans cet angle.","reussi":"Les coudes montent avant les mains, et les trapèzes ne se contractent pas vers les oreilles."}]}]},{"n":"03","name":"À la barre de traction","sub":"Deux prises, au même endroit","duration":"~12 min · repos 1'15","items":[{"id":"a-tractions","name":"Tractions pronation","sub":"Barre fixe · Mains vers l'avant · Grand dorsal","sets":4,"reps":"6–8","tempo":"2-1-2","trackLoad":true,"step":2.5,"loadHint":"poids de corps ou + 5 à 15 kg","execution":"Prise un peu plus large que les épaules. Avant de tirer, abaisse les épaules pour éloigner les oreilles des mains — c'est ce geste qui met le dos en action. Monte jusqu'à ce que le menton dépasse la barre, redescends en 2 secondes bras presque tendus.","avoid":"Le coup de reins pour arracher la répétition : mieux vaut 5 tractions propres que 8 balancées.","alt":"Tractions à la machine assistée ou en élastique si tu ne tiens pas 6 répétitions strictes ; ceinture de lest quand tu passes 10.","type":"ex","rest":75,"setup":"Barre fixe, prise en pronation un peu plus large que les épaules. Suspends-toi bras tendus, jambes croisées derrière toi, puis abaisse les épaules — éloigne les oreilles des mains — avant la première traction.","reussi":"Le menton passe la barre sans coup de reins, et en bas les bras se tendent complètement à chaque répétition."},{"id":"c-tractions-sup","name":"Tractions supination","sub":"Barre fixe · Mains vers soi · Dorsaux + Biceps","sets":3,"reps":"8","tempo":"2-1-2","trackLoad":true,"step":2.5,"loadHint":"poids de corps ou + 5 à 12 kg","execution":"Prise supination largeur d'épaules. Tire les coudes vers le bas et vers l'arrière, marque 1 seconde en haut poitrine près de la barre, descends en 2 secondes. La prise supination fait beaucoup travailler le biceps : c'est voulu, il n'y a pas de bloc bras dans cette séance.","avoid":"Une descente en chute libre, très irritante pour le coude en supination.","alt":"Tirage vertical prise neutre serrée, 4 × 10, ou machine assistée.","type":"ex","rest":75,"setup":"La même barre, prise en supination largeur d'épaules, paumes vers toi. Suspends-toi bras tendus, abaisse les épaules, laisse le corps s'immobiliser.","reussi":"La poitrine approche la barre en haut, et la descente prend deux bonnes secondes jusqu'aux bras tendus."}]},{"n":"04","name":"À la station de câbles","sub":"Pectoraux et biceps · 3 tours","duration":"~10 min · repos 1'15","items":[{"type":"superset","id":"c-ss2","rounds":3,"rest":75,"label":"Écartés puis curl — une poussée et un tirage, rien qui se gêne","exercises":[{"id":"c-ecartes","name":"Écartés câbles croisés","sub":"Poulies hautes · Pectoraux · Tension constante","sets":3,"reps":"15","tempo":"2-1-3","trackLoad":true,"step":2.5,"loadHint":"12–20 kg par côté","execution":"Poulies en position haute, un pas en avant, buste légèrement penché. Amène les mains l'une vers l'autre devant le bas du torse en gardant une petite flexion de coude constante, croise-les de quelques centimètres et marque 1 seconde. Laisse revenir en 3 secondes jusqu'à sentir l'étirement complet.","avoid":"Plier et déplier les coudes : ça devient une extension triceps.","alt":"Écartés à la machine pec deck, 3 × 15.","setup":"Les deux poulies en position haute, une poignée dans chaque main. Prends-les, fais un pas en avant pour te placer au centre, un pied devant l'autre, buste légèrement penché. Le câble doit déjà tirer bras écartés.","reussi":"L'angle du coude est le même en position écartée et en position croisée, et l'étirement se sent en travers de la poitrine."},{"id":"c-curl-poulie","name":"Curl à la poulie basse","sub":"Câble · Barre EZ ou corde · Biceps · Tension constante","sets":3,"reps":"12","tempo":"2-1-3","trackLoad":true,"step":2.5,"loadHint":"25–40 kg","execution":"Debout face à la poulie basse, coudes collés au corps et immobiles. L'intérêt du câble : la tension existe déjà en bas du mouvement, là où un haltère ne pèse presque rien — le biceps travaille donc sur toute la course. Marque 1 seconde en haut, descends en 3 secondes jusqu'aux bras tendus.","avoid":"Reculer les coudes ou balancer le buste pour finir la série : baisse la charge plutôt.","alt":"Curl haltères debout, ou curl à la barre EZ, 4 × 12 — mais ils te font quitter la station.","setup":"Barre EZ ou corde accrochée à la poulie basse. Debout face à la poulie, à un pas d'elle, coudes contre les côtes, bras tendus vers le bas.","reussi":"Les coudes restent collés aux côtes et le buste ne recule pas pour aider."}]}]},{"n":"05","name":"Aux machines","sub":"Ischios, mollets, abdominaux · 3 tours","duration":"~14 min · repos 1 min","items":[{"type":"superset","id":"c-ss3","rounds":3,"rest":60,"label":"Trois exercices sans rien en commun, enchaînés","exercises":[{"id":"a-legcurl","name":"Leg curl assis","sub":"Machine · Ischio-jambiers · Isolation","sets":3,"reps":"12","tempo":"2-1-3","trackLoad":true,"step":5,"loadHint":"35–55 kg","execution":"Règle le dossier pour que les genoux soient dans l'axe de l'articulation de la machine. Plie en tirant les talons sous le siège, marque 1 seconde en position courte, puis laisse remonter en 3 secondes en freinant. C'est la descente freinée qui fait le travail ici. Le leg curl ASSIS est choisi volontairement plutôt que couché : hanche fléchie, l'ischio travaille plus étiré, et il grossit davantage — surtout sa partie longue.","avoid":"Décoller les fesses du siège pour gagner de l'amplitude.","alt":"Leg curl couché, ou nordic curl à deux si aucune machine n'est libre.","setup":"Règle le dossier pour que l'axe de ton genou soit aligné avec l'axe de rotation de la machine, serre la barre de cuisses pour ne pas décoller, et place le rouleau juste au-dessus des talons.","reussi":"Les fesses restent dans le siège, et la remontée dure vraiment trois secondes."},{"id":"c-mollets","name":"Mollets debout","sub":"Machine ou barre · Amplitude complète","sets":3,"reps":"18","tempo":"2-1-2","trackLoad":true,"step":5,"loadHint":"60–100 kg","execution":"Avant-pieds sur la plateforme. Laisse les talons descendre le plus bas possible pour étirer complètement, puis monte sur la pointe des pieds et tiens 1 seconde en haut. L'amplitude complète compte plus que la charge. Debout genou tendu, et non assis : c'est cette position qui étire le mollet et le fait grossir, la version assise n'apporte presque rien de plus sur le soléaire.","avoid":"Les demi-répétitions rapides en rebond.","alt":"Mollets à la presse à cuisses, 3 × 20.","setup":"Avant-pieds sur le bord de la plateforme, talons dans le vide. Règle les épaulières pour être en appui debout jambes tendues sans avoir à te tasser pour t'y glisser.","reussi":"En bas le talon descend nettement sous le niveau de l'avant-pied, en haut tu tiens une seconde pleine sur la pointe."},{"id":"c-releves","name":"Relevés de jambes suspendus","sub":"Barre fixe · Abdominaux · Compression","sets":3,"reps":"12","tempo":"2-1-3","execution":"Suspendu à la barre, épaules actives (pas complètement relâché). Monte les jambes tendues le plus haut possible en enroulant le bassin vers le haut à la fin du mouvement, puis redescends en 3 secondes sans balancer.","avoid":"Le balancier : si tu te balances, plie les genoux et fais des relevés genoux fléchis.","alt":"Relevés de genoux suspendus 3 × 15, ou hollow hold 3 × 30 sec.","setup":"Suspendu à la barre en pronation, largeur d'épaules. Pousse légèrement sur la barre pour garder les épaules actives plutôt que de pendre au bout des articulations. Attends que le corps s'immobilise avant la première répétition.","reussi":"Le bassin s'enroule vers le haut en fin de montée, et le corps ne se balance pas entre deux répétitions."}]}]}]}}}
</script>

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function daysBetween(iso) {
    if (!iso) return null;
    var p = iso.split('-');
    var a = new Date(+p[0], +p[1] - 1, +p[2]);
    var b = new Date();
    a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0);
    return Math.round((b - a) / 86400000);
  }

  function agoLabel(iso) {
    var d = daysBetween(iso);
    if (d === null) return 'jamais faite';
    if (d === 0) return "aujourd'hui";
    if (d === 1) return 'hier';
    if (d < 7) return 'il y a ' + d + ' jours';
    if (d < 14) return 'il y a 1 semaine';
    if (d < 31) return 'il y a ' + Math.floor(d / 7) + ' semaines';
    return 'il y a plus d’un mois';
  }

  function fmtNum(v) {
    if (v == null || v === '') return '';
    var n = Math.round(Number(v) * 100) / 100;
    return String(n).replace('.', ',');
  }

  function parseNum(s) {
    if (s == null) return NaN;
    var v = String(s).replace(',', '.').replace(/[^\d.\-]/g, '');
    return v === '' ? NaN : Number(v);
  }

  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + pad(sec % 60);
  }

  function restLabel(sec) {
    if (!sec) return null;
    if (sec % 60 === 0) return (sec / 60) + ' min';
    if (sec < 60) return sec + ' sec';
    return Math.floor(sec / 60) + "'" + pad(sec % 60);
  }

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  var toastT;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  /* ─────────── Pictogrammes ─────────── */

    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5zM8 7h7M8 11h7"/></svg>',

  /* ─────────── Mémoire locale ─────────── */
  var S = {
    theme: 'auto',

    sets: {},    // date -> { exId: [bool,...] }
    rounds: {},  // date -> { ssId: n }
    hist: {},    // sessionKey -> ['YYYY-MM-DD', ...]
    rests: {},   // exId | ssId -> repos ajusté à la main pour cet exercice
    tabata: { work: 20, rest: 10, rounds: 8, prep: 10 },
    lastTimer: 90
  };

  function loadState() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      ['theme', 'lastTimer'].forEach(function (k) { if (o[k] != null) S[k] = o[k]; });
      ['loads', 'notes', 'sets', 'rounds', 'hist', 'rests'].forEach(function (k) { if (o[k]) S[k] = o[k]; });
      if (o.tabata) for (var k in o.tabata) S.tabata[k] = o.tabata[k];
    } catch (e) { console.warn('mémoire illisible', e); }
  }

  var saveT;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(S)); }
      catch (e) { toast('Mémoire du navigateur pleine'); }
    }, 180);
  }

  /* ─────────── Thème ─────────── */
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  function applyTheme() {
    var dark = S.theme === 'dark' || (S.theme === 'auto' && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }

  mq.addEventListener('change', function () { if (S.theme === 'auto') applyTheme(); });

  /* ─────────── Accès au programme ─────────── */
  function allItems(sess) {
    var out = [];
    sess.blocs.forEach(function (b) { b.items.forEach(function (it) { out.push(it); }); });
    return out;
  }

  function exercisesOf(item) {
    return item.type === 'superset' ? item.exercises : [item];
  }

  function findEx(id) {
    for (var k in P.sessions) {
      var items = allItems(P.sessions[k]);
      for (var i = 0; i < items.length; i++) {
        var list = exercisesOf(items[i]);
        for (var j = 0; j < list.length; j++) if (list[j].id === id) return list[j];
      }
    }
    return null;
  }

  function findAny(id) {
    for (var k in P.sessions) {
      var items = allItems(P.sessions[k]);
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === id) return items[i];
        var list = exercisesOf(items[i]);
        for (var j2 = 0; j2 < list.length; j2++) if (list[j2].id === id) return list[j2];
      }
    }
    return null;
  }

  /* Repos de CET exercice : celui du programme, ou celui que tu as réglé toi-même. */
  function restOf(id) {
    var o = findAny(id);
    if (S.rests[id] != null) return S.rests[id];
    return (o && o.rest) || 0;
  }

  function setRestOf(id, sec) {
    var o = findAny(id);
    sec = Math.min(600, Math.max(15, sec));
    if (o && o.rest === sec) delete S.rests[id]; else S.rests[id] = sec;
    save();
  }

  /* ─────────── Suivi du jour ─────────── */
  function todaySets(exId, n) {
    var d = today();
    S.sets[d] = S.sets[d] || {};
    var a = S.sets[d][exId];
    if (!Array.isArray(a) || a.length !== n) {
      a = [];
      for (var i = 0; i < n; i++) a.push(false);
      S.sets[d][exId] = a;
    }
    return a;
  }

  function todayRounds(ssId) {
    var d = today();
    S.rounds[d] = S.rounds[d] || {};
    if (typeof S.rounds[d][ssId] !== 'number') S.rounds[d][ssId] = 0;
    return S.rounds[d][ssId];
  }

  function sessionUnits(sess) {
    var total = 0, done = 0;
    allItems(sess).forEach(function (it) {
      if (it.type === 'superset') {
        total += it.rounds;
        done += Math.min(it.rounds, todayRounds(it.id));
      } else {
        total += it.sets || 1;
        todaySets(it.id, it.sets || 1).forEach(function (v) { if (v) done++; });
      }
    });
    return { total: total, done: done };
  }

  function exCount(sess) {
    var n = 0;
    allItems(sess).forEach(function (it) { n += exercisesOf(it).length; });
    return n;
  }

  function markSessionDone(key) {
    var d = today();
    S.hist[key] = S.hist[key] || [];
    if (S.hist[key].indexOf(d) === -1) { S.hist[key].push(d); S.hist[key].sort(); }
    save();
  }

  function lastDone(key) {
    var h = S.hist[key];
    return h && h.length ? h[h.length - 1] : null;
  }

  function thisWeekCount(key) {
    var h = S.hist[key] || [];
    var now = new Date();
    var dow = (now.getDay() + 6) % 7;           // lundi = 0
    var monday = new Date(now); monday.setDate(now.getDate() - dow); monday.setHours(0, 0, 0, 0);
    return h.filter(function (d) {
      var p = d.split('-');
      return new Date(+p[0], +p[1] - 1, +p[2]) >= monday;
    }).length;
  }

  /* ─────────── Charges ─────────── */
  function loadHist(exId) { return S.loads[exId] || []; }

  function lastLoad(exId) {
    var h = loadHist(exId);
    return h.length ? h[h.length - 1] : null;
  }

  function suggestLoad(ex) {
    var h = loadHist(ex.id);
    if (!h.length) return null;
    var last = h[h.length - 1].v;
    var step = ex.step || 2.5;
    // Deux séances de suite à la même charge : il est temps de monter.
    var same = 1;
    for (var i = h.length - 2; i >= 0; i--) { if (h[i].v === last) same++; else break; }
    return { value: same >= 2 ? last + step : last, up: same >= 2, same: same };
  }

  function setLoad(exId, val) {
    var h = S.loads[exId] = S.loads[exId] || [];
    var d = today();
    if (h.length && h[h.length - 1].d === d) h[h.length - 1].v = val;
    else h.push({ d: d, v: val });
    if (h.length > 40) h.splice(0, h.length - 40);
    save();
  }

  /* ═══════════ ACCUEIL ═══════════ */

            '<span class="card-title">' + esc(s.title) + '</span>' +
            '<span class="card-sub">' + esc(s.subtitle) + '</span>' +
            '<span class="card-meta">' + exCount(s) + ' exercices · ' + esc(s.duration) +

            (u.done ?
              '<span class="card-prog">' +
                '<span class="bar"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
                '<span class="card-prog-txt">' + u.done + '/' + u.total + ' séries</span>' +

    }).join('');

    app.innerHTML = '' +
      '<div class="wrap">' +
        '<header class="top"><div class="top-row">' +
          '<div>' +
            '<h1 class="brand-name">' + esc(P.meta.name) + '</h1>' +
            '<p class="brand-sub">' + esc(P.meta.tagline) + '</p>' +
          '</div>' +
          '<div class="icon-btn-row">' +
            '<button class="icon-btn" id="theme-btn" aria-label="Changer de thème"></button>' +
            '<button class="icon-btn" id="set-btn" aria-label="Réglages">' + I.gear + '</button>' +
          '</div>' +
        '</div></header>' +

        '<div class="week">' +
          '<div>' +
            '<div class="week-label">Cette semaine</div>' +
            '<div class="week-count">' + weekTotal + ' séance' + (weekTotal > 1 ? 's' : '') + ' sur 3</div>' +
          '</div>' +
          '<div class="week-dots">' + dots + '</div>' +
        '</div>' +

        '<div class="deck">' + cards + '</div>' +

        '<div class="section-label">Outils</div>' +
        '<div class="tools">' +
          '<button class="tool" id="t-timer"><div class="tool-ico">' + I.timer + '</div><div class="tool-name">Minuteur</div><div class="tool-sub">Repos libre</div></button>' +
          '<button class="tool" id="t-tabata"><div class="tool-ico">' + I.bolt + '</div><div class="tool-name">Tabata</div><div class="tool-sub">Intervalles</div></button>' +
          '<button class="tool" id="t-guide"><div class="tool-ico">' + I.book + '</div><div class="tool-name">Méthode</div><div class="tool-sub">Comment progresser</div></button>' +
          '<button class="tool" id="t-set"><div class="tool-ico">' + I.gear + '</div><div class="tool-name">Réglages</div><div class="tool-sub">Thème, données</div></button>' +
        '</div>' +

        '<p class="foot">' + esc(P.meta.cycle) + '<br>Tout est enregistré sur cet appareil uniquement.</p>' +
      '</div>';

    paintThemeBtn();

    $('#t-set').addEventListener('click', sheetSettings);

    $('#t-tabata').addEventListener('click', sheetTabata);

  function paintThemeBtn() {
    var b = $('#theme-btn');
    if (!b) return;
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    b.innerHTML = dark ? I.moon : I.sun;
  }

  function cycleTheme() {
    S.theme = S.theme === 'auto' ? 'light' : (S.theme === 'light' ? 'dark' : 'auto');
    applyTheme(); paintThemeBtn(); save();
    toast('Thème : ' + (S.theme === 'auto' ? 'automatique' : S.theme === 'light' ? 'clair' : 'sombre'));
  }

  /* ═══════════ VUE SÉANCE ═══════════ */
  var curKey = null;

  function renderSession(key) {
    curKey = key;
    var s = P.sessions[key];
    document.body.style.setProperty('--a', s.accent);
    document.body.style.setProperty('--a2', s.accent2);

    var nav = s.blocs.map(function (b, i) {
      return '<button class="tab' + (i === 0 ? ' on' : '') + '" data-bloc="' + i + '">' + esc(b.name.split('—')[0].trim()) + '</button>';
    }).join('');

    var blocs = s.blocs.map(function (b, bi) {
      var items = b.items.map(function (it, ii) {
        return it.type === 'superset' ? renderSuperset(it, ii) : renderEx(it, ii + 1, false);
      }).join('');
      /* Le poste est un creux teinté ; chaque exercice est une carte posée dedans.
         Sans ce contraste, un titre de poste et un exercice se ressemblaient. */
      return '' +
        '<section class="bloc" id="bloc-' + bi + '">' +
          '<div class="bloc-head">' +
            '<span class="bloc-n">' + esc(b.n) + '</span>' +
            '<span class="bloc-name">' + esc(b.name) + '</span>' +
            '<span class="bloc-dur">' + esc(b.duration || '') + '</span>' +
          '</div>' +
          (b.sub ? '<div class="bloc-sub">' + esc(b.sub) + '</div>' : '') +
          '<div class="bloc-corps">' + items + '</div>' +
        '</section>';
    }).join('');

    app.innerHTML = '' +
      '<header class="s-head"><div class="wrap"><div class="s-head-in">' +
        '<button class="back" id="back" aria-label="Retour">' + I.back + '</button>' +
        '<div class="s-head-txt">' +
          '<div class="s-head-sub" id="s-head-sub">Séance ' + esc(s.code) + '</div>' +
          '<h1 class="s-head-title">' + esc(s.title) + '</h1>' +
        '</div>' +
        '<button class="s-head-btn" id="quick-timer">' + I.timer + '<span id="quick-timer-lab">' + S.lastTimer + 's</span></button>' +
      '</div>' +
        '<div class="s-prog"><div class="s-prog-fill" id="s-prog-fill"></div></div>' +

      '<nav class="blocnav"><div class="blocnav-in" id="blocnav">' + nav + '</div></nav>' +
      '<div class="wrap">' +
        '<div class="s-intro">' + esc(s.intro) + '</div>' +
        blocs +
        '<p class="foot">Séance ' + esc(s.code) + ' · ' + esc(s.duration) + '<br>' + esc(agoLabel(lastDone(key))) + '</p>' +
      '</div>';

    wireSession(s);
    majAvancement();
    window.scrollTo(0, 0);
